version: '3.8'
# Same isolated definition for compose and Swarm. No backend/data ports published.
services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql-root-password
    volumes:
      - mysql-data:/var/lib/mysql
    secrets:
      - mysql-root-password
      - center-db-password
      - course-db-password
    configs:
      - source: mysql-init
        target: /docker-entrypoint-initdb.d/10-databases.sh
        mode: 0555
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 --silent']
      interval: 5s
      retries: 60
    deploy:
      replicas: 1
      placement: {constraints: ['node.role == manager']}
      resources: {limits: {memory: 1500M}}
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    networks: [private]
    deploy:
      replicas: 1
      resources: {limits: {memory: 256M}}
  rbac-backend:
    image: ${REGISTRY:-}${MODULE:-rbac-structured}:${TAG:-local}
    build:
      context: .
      args: {MODULE: '${MODULE:-rbac-structured}'}
    environment:
      SERVER_PORT: ${RBAC_PORT:-8081}
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rbac_center?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: rbac_center
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      RBAC_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt-private.pem
      RBAC_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt-public.pem
      RBAC_JWT_KID: ${JWT_KID:-rbac1-acceptance-1}
      RBAC_JWT_ISSUER: ${JWT_ISSUER:-https://identity.rbac1.local}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: ${SECURITY_LOG_LEVEL:-INFO}
      JAVA_OPTS: ${APP_JAVA_OPTS:--Xms128m -Xmx768m}
      LOGGING_LEVEL_COM_XMU_RBAC_STRUCTURED_CONTROLLER: ${API_LOG_LEVEL:-INFO}
      LOGGING_LEVEL_COM_XMU_RBAC_STRUCTURED_SERVICE: ${SERVICE_LOG_LEVEL:-INFO}
      LOGGING_LEVEL_COM_XMU_RBAC_STRUCTURED_MAPPER: ${PERSISTENCE_LOG_LEVEL:-INFO}
      LOGGING_LEVEL_COM_XMU_RBAC_STRUCTURED_CONFIG_LAYERLOGGINGASPECT: ${LAYER_LOG_LEVEL:-INFO}
      LOGGING_LEVEL_COM_XMU_RBAC_DDD_INTERFACES: ${API_LOG_LEVEL:-INFO}
      LOGGING_LEVEL_COM_XMU_RBAC_DDD_APPLICATION: ${SERVICE_LOG_LEVEL:-INFO}
      LOGGING_LEVEL_COM_XMU_RBAC_DDD_INFRASTRUCTURE: ${PERSISTENCE_LOG_LEVEL:-INFO}
      LOGGING_LEVEL_COM_XMU_RBAC_DDD_INFRASTRUCTURE_LOGGING_LAYERLOGGINGASPECT: ${LAYER_LOG_LEVEL:-INFO}
    secrets:
      - source: center-db-password
        target: spring.datasource.password
      - source: bootstrap-password
        target: rbac.bootstrap-password
      # DDD currently reads this exact uppercase placeholder; same secret, not a second value.
      - source: bootstrap-password
        target: RBAC_BOOTSTRAP_PASSWORD
      - source: audit-service-key
        target: rbac.audit-service-key
      - jwt-private.pem
      - jwt-public.pem
    networks: [private]
    deploy:
      replicas: 1
      update_config: {order: stop-first, parallelism: 1}
      rollback_config: {order: stop-first, parallelism: 1}
      restart_policy: {condition: on-failure, delay: 10s}
      resources: {limits: {memory: 1200M}}
  rbac-gateway:
    image: ${REGISTRY:-}rbac-gateway:${TAG:-local}
    build:
      context: .
      args: {MODULE: rbac-gateway}
    environment:
      SERVER_PORT: ${GATEWAY_PORT:-8090}
      IDENTITY_BASE_URL: http://rbac-backend:${RBAC_PORT:-8081}
      COURSE_BASE_URL: http://course-backend:${COURSE_PORT:-8080}
      GATEWAY_ISSUER: ${JWT_ISSUER:-https://identity.rbac1.local}
      GATEWAY_JWK_SET_URI: http://rbac-backend:${RBAC_PORT:-8081}/.well-known/jwks.json
      GATEWAY_ALLOW_HTTP: 'true'
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: ${SECURITY_LOG_LEVEL:-INFO}
    networks: [private]
    deploy:
      replicas: 1
      restart_policy: {condition: on-failure, delay: 10s}
      resources: {limits: {memory: 768M}}
  rbac-web:
    image: ${REGISTRY:-}rbac-web:${TAG:-local}
    build: {context: ./rbac-web}
    environment:
      RBAC_PORT: ${RBAC_PORT:-8081}
    configs:
      - source: rbac-nginx
        target: /etc/nginx/templates/default.conf.template
    secrets: [tls.key, tls.crt]
    ports:
      - '${RBAC_TLS_PORT:-8443}:443'
    networks: [private]
    deploy:
      replicas: 1
      restart_policy: {condition: on-failure, delay: 5s}
      resources: {limits: {memory: 128M}}
  course-backend:
    image: ${REGISTRY:-}course-backend:${TAG:-local}
    build:
      context: ${COURSE_BUILD:-.cache/course-source/prepared}/backend
      dockerfile: ${COURSE_DOCKERFILE:-../../../../deploy/full-course-backend.Dockerfile}
    environment:
      SERVER_PORT: ${COURSE_PORT:-8080}
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rbac_course?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: rbac_course
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      RBAC_JWT_ISSUER: ${JWT_ISSUER:-https://identity.rbac1.local}
      SPRING_PROFILES_ACTIVE: integration
      IDENTITY_ISSUER: ${JWT_ISSUER:-https://identity.rbac1.local}
      IDENTITY_JWK_SET_URI: http://rbac-backend:${RBAC_PORT:-8081}/.well-known/jwks.json
      IDENTITY_BASE_URL: http://rbac-backend:${RBAC_PORT:-8081}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: rbac_course
      DB_USER: rbac_course
      LOGGING_LEVEL_CN_EDU_XMU_PROJECTMGT_API: ${API_LOG_LEVEL:-INFO}
      LOGGING_LEVEL_CN_EDU_XMU_PROJECTMGT_SERVICE: ${SERVICE_LOG_LEVEL:-INFO}
      LOGGING_LEVEL_CN_EDU_XMU_PROJECTMGT_INFRASTRUCTURE: ${PERSISTENCE_LOG_LEVEL:-INFO}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB_CLIENT: WARN
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: ${SECURITY_LOG_LEVEL:-INFO}
    secrets:
      - source: course-db-password
        target: spring.datasource.password
      - source: audit-service-key
        target: app.integration.service-key
      - source: course-db-password
        target: DB_PASSWORD
    networks: [private]
    deploy:
      replicas: 1
      restart_policy: {condition: on-failure, delay: 10s}
      resources: {limits: {memory: 1200M}}
  course-web:
    image: ${REGISTRY:-}course-web:${TAG:-local}
    build:
      context: .
      dockerfile: deploy/full-course-web.Dockerfile
    environment:
      RBAC_PORT: ${RBAC_PORT:-8081}
      GATEWAY_PORT: ${GATEWAY_PORT:-8090}
    configs:
      - source: course-nginx
        target: /etc/nginx/templates/default.conf.template
    secrets: [tls.key, tls.crt]
    ports:
      - '${COURSE_TLS_PORT:-9443}:443'
    networks: [private]
    deploy:
      replicas: 1
      restart_policy: {condition: on-failure, delay: 5s}
      resources: {limits: {memory: 128M}}
networks:
  private:
    driver: overlay
    attachable: true
volumes:
  mysql-data:
secrets:
  mysql-root-password: {file: '${RUNTIME_DIR:-.runtime/full}/mysql-root-password'}
  center-db-password: {file: '${RUNTIME_DIR:-.runtime/full}/center-db-password'}
  course-db-password: {file: '${RUNTIME_DIR:-.runtime/full}/course-db-password'}
  bootstrap-password: {file: '${RUNTIME_DIR:-.runtime/full}/bootstrap-password'}
  audit-service-key: {file: '${RUNTIME_DIR:-.runtime/full}/audit-service-key'}
  jwt-private.pem: {file: '${RUNTIME_DIR:-.runtime/full}/jwt-private.pem'}
  jwt-public.pem: {file: '${RUNTIME_DIR:-.runtime/full}/jwt-public.pem'}
  tls.key: {file: '${RUNTIME_DIR:-.runtime/full}/tls.key'}
  tls.crt: {file: '${RUNTIME_DIR:-.runtime/full}/tls.crt'}
configs:
  mysql-init: {file: ./deploy/full-mysql-init.sh}
  rbac-nginx: {file: ./rbac-web/nginx.conf}
  course-nginx: {file: ./deploy/full-course-nginx.conf}
