server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /run/secrets/tls.crt;
    ssl_certificate_key /run/secrets/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    location ~ ^/(integration|identity)(/|$) { return 403; }
    location ~ ^/(auth|\.well-known)(/|$) {
        proxy_pass http://rbac-backend:${RBAC_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Audit-Service-Key "";
    }
    location /api/ {
        proxy_pass http://rbac-gateway:${GATEWAY_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Audit-Service-Key "";
        client_max_body_size 10m;
    }
    location / { try_files $uri $uri/ /index.html; }
}
