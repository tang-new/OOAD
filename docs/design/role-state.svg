<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="292px" preserveAspectRatio="none" style="width:1197px;height:292px;background:#FFFFFF;" version="1.1" viewBox="0 0 1197 292" width="1197px" zoomAndPan="magnify"><title>Role actual two-state behavior (DDD domain + application guard)</title><defs/><g><text fill="#000000" font-family="Microsoft YaHei" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="465.3838" x="358.9834" y="24.8135">Role actual two-state behavior (DDD domain + application guard)</text><ellipse cx="16" cy="67.4775" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="73.2598" x="381" y="47.4775"/><text fill="#000000" font-family="Microsoft YaHei" font-size="14" lengthAdjust="spacing" textLength="63.2598" x="386" y="73.0522">ENABLED</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="77.04" x="942.5" y="46.4775"/><text fill="#000000" font-family="Microsoft YaHei" font-size="14" lengthAdjust="spacing" textLength="67.04" x="947.5" y="72.0522">DISABLED</text><g class="entity" data-entity="GMN2" data-source-line="9" data-uid="ent0003" id="entity_GMN2"><path d="M246,122.9775 L246,150.1353 A0,0 0 0 0 246,150.1353 L589.1816,150.1353 A0,0 0 0 0 589.1816,150.1353 L589.1816,132.9775 L579.1816,122.9775 L421.5,122.9775 L417.5,87.7675 L413.5,122.9775 L246,122.9775 A0,0 0 0 0 246,122.9775" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M579.1816,122.9775 L579.1816,132.9775 L589.1816,132.9775 L579.1816,122.9775" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Microsoft YaHei" font-size="13" lengthAdjust="spacing" textLength="322.1816" x="252" y="141.7329">Repeated status assignment is legal (self transition).</text></g><g class="entity" data-entity="GMN5" data-source-line="12" data-uid="ent0006" id="entity_GMN5"><path d="M772,121.4775 L772,285.897 A0,0 0 0 0 772,285.897 L1190.3506,285.897 A0,0 0 0 0 1190.3506,285.897 L1190.3506,131.4775 L1180.3506,121.4775 L985,121.4775 L981,86.6175 L977,121.4775 L772,121.4775 A0,0 0 0 0 772,121.4775" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1180.3506,121.4775 L1180.3506,131.4775 L1190.3506,131.4775 L1180.3506,121.4775" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Microsoft YaHei" font-size="13" lengthAdjust="spacing" textLength="372.4487" x="778" y="140.2329">Role.changeStatus is an assignment, not an event publisher.</text><text fill="#000000" font-family="Microsoft YaHei" font-size="13" lengthAdjust="spacing" textLength="320.4868" x="778" y="157.3906">status &#8594; requireRoleManagement &#8594; changeStatus;</text><text fill="#000000" font-family="Microsoft YaHei" font-size="13" lengthAdjust="spacing" textLength="352.5044" x="778" y="174.5483">when enabling: upperBound; then saveRole &#8594; complete.</text><text fill="#000000" font-family="Microsoft YaHei" font-size="13" lengthAdjust="spacing" textLength="343.4717" x="778" y="191.7061">complete &#8594; GrantIntegrityService.requireAdministrator</text><text fill="#000000" font-family="Microsoft YaHei" font-size="13" lengthAdjust="spacing" textLength="225.5767" x="778" y="208.8638">&#8594; version + same-transaction audit.</text><text fill="#000000" font-family="Microsoft YaHei" font-size="13" lengthAdjust="spacing" textLength="353.4375" x="778" y="226.0215">Privileged actor may disable a role only if integrity holds.</text><text fill="#000000" font-family="Microsoft YaHei" font-size="13" lengthAdjust="spacing" textLength="397.3506" x="778" y="243.1792">Structured: ManagementService.roleStatus assigns string status;</text><text fill="#000000" font-family="Microsoft YaHei" font-size="13" lengthAdjust="spacing" textLength="349.6543" x="778" y="260.3369">finish &#8594; preserveAdministrator prevents last admin loss.</text><text fill="#000000" font-family="Microsoft YaHei" font-size="13" lengthAdjust="spacing" textLength="239.1353" x="778" y="277.4946">No fictitious RoleStatusChangedEvent.</text></g><!--link *start* to ENABLED--><g class="link" data-entity-1="*start*" data-entity-2="ENABLED" data-source-line="5" data-uid="lnk4" id="link_*start*_ENABLED"><path d="M26.09,67.4775 C73.54,67.4775 287.8,67.4775 374.91,67.4775" fill="none" id="*start*-to-ENABLED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="380.91,67.4775,371.91,63.4775,375.91,67.4775,371.91,71.4775,380.91,67.4775" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Microsoft YaHei" font-size="13" lengthAdjust="spacing" textLength="158.2788" x="57" y="63.2329">create(... enabled=true ...)</text></g><!--link ENABLED to DISABLED--><g class="link" data-entity-1="ENABLED" data-entity-2="DISABLED" data-source-line="6" data-uid="lnk6" id="link_ENABLED_DISABLED"><path d="M454.05,67.4175 C554.46,67.2375 833.55,66.738 936.41,66.558" fill="none" id="ENABLED-to-DISABLED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="942.41,66.5475,933.403,62.5633,937.41,66.5563,933.417,70.5633,942.41,66.5475" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Microsoft YaHei" font-size="13" lengthAdjust="spacing" textLength="121.0435" x="620" y="63.2329">changeStatus(false)</text></g><!--link DISABLED to ENABLED--><g class="link" data-entity-1="DISABLED" data-entity-2="ENABLED" data-source-line="7" data-uid="lnk7" id="link_DISABLED_ENABLED"><path d="M942.34,72.9875 C876.7,83.5275 737.07,102.3875 619,94.4775 C561,90.5875 500.1178,81.4375 460.1278,74.7475" fill="none" id="DISABLED-to-ENABLED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="454.21,73.7575,462.4266,79.1877,459.1415,74.5825,463.7466,71.2974,454.21,73.7575" style="stroke:#181818;s