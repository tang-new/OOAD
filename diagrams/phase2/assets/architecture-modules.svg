<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1360" viewBox="0 0 1660 1360" role="img" aria-label="05 / 工程模块与双后端依赖"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#21796c" stroke-width="1.5"/></marker><marker id="filled" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#21796c"/></marker></defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#18322f} .mono{font-family:Consolas,'Courier New',monospace} .edge{fill:none;stroke:#21796c;stroke-width:1.5} .label{paint-order:stroke;stroke:#faf9f4;stroke-width:7;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="#faf9f4"/><rect x="0" width="9" height="100%" fill="#21796c"/><text x="44" y="49" font-size="28" font-weight="bold" style="fill:#18322f" >05 / 工程模块与双后端依赖</text><text x="45" y="80" font-size="15" font-weight="normal" style="fill:#62736e" >构建视角 · 箭头从使用方指向被依赖方；domain 不依赖外层技术组件</text><rect x="480" y="125" width="690" height="125" rx="12" fill="#e9f3ee" stroke="#b8c7bf"/><text x="498" y="150" font-size="12" font-weight="bold" style="fill:#21796c" >SHARED CONTRACT</text><text x="498" y="178" font-size="21" font-weight="bold" style="fill:#18322f" >rbac-contract</text><text x="498" y="208" font-size="16" font-weight="normal" style="fill:#62736e" >唯一中心 OAS · 教师操作目录 · V1/V2 SQL · 错误词汇</text><text x="498" y="233" font-size="16" font-weight="normal" style="fill:#62736e" >共享协议和数据定义，不共享核心业务算法</text><polyline points="390,330 390,210 480,210" class="edge"  marker-end="url(#filled)"/><polyline points="1240,330 1240,210 1170,210" class="edge"  marker-end="url(#filled)"/><rect x="55" y="300" width="720" height="600" rx="12" fill="#e9f3ee" stroke="#b8c7bf"/><rect x="880" y="300" width="720" height="600" rx="12" fill="#fbf0df" stroke="#b8c7bf"/><text x="80" y="338" font-size="24" font-weight="bold" style="fill:#18322f" >rbac-structured / 事务脚本式分层</text><text x="905" y="338" font-size="24" font-weight="bold" style="fill:#18322f" >rbac-ddd / 领域职责与端口适配</text><polyline points="415,450 415,495" class="edge"  marker-end="url(#filled)"/><polyline points="415,595 415,640" class="edge"  marker-end="url(#filled)"/><rect x="95" y="375" width="640" height="75" rx="12" fill="white" stroke="#b8c7bf"/><text x="113" y="407" font-size="21" font-weight="bold" style="fill:#18322f" >controller</text><text x="113" y="437" font-size="16" font-weight="normal" style="fill:#62736e" >HTTP 接入 / DTO 校验 / 响应映射</text><rect x="95" y="495" width="640" height="100" rx="12" fill="white" stroke="#b8c7bf"/><text x="113" y="527" font-size="21" font-weight="bold" style="fill:#18322f" >service</text><text x="113" y="557" font-size="16" font-weight="normal" style="fill:#62736e" >管理流程、DAG 算法、授权上界、事务与审计</text><rect x="95" y="640" width="640" height="95" rx="12" fill="white" stroke="#b8c7bf"/><text x="113" y="672" font-size="21" font-weight="bold" style="fill:#18322f" >mapper / Store</text><text x="113" y="702" font-size="16" font-weight="normal" style="fill:#62736e" >Spring Data JPA / EntityManager / 数据锁</text><rect x="95" y="790" width="640" height="75" rx="12" fill="white" stroke="#b8c7bf"/><text x="113" y="822" font-size="21" font-weight="bold" style="fill:#18322f" >辅助包：entity / dto / config</text><text x="113" y="852" font-size="16" font-weight="normal" style="fill:#62736e" >分别提供数据对象、协议边界与框架装配</text><polyline points="1240,450 1240,495" class="edge"  marker-end="url(#filled)"/><polyline points="1240,595 1240,640" class="edge"  marker-end="url(#filled)"/><polyline points="1560,827 1580,827 1580,690 1560,690" class="edge" stroke-dasharray="7 5" marker-end="url(#filled)"/><text x="1460" y="754" font-size="15" font-weight="normal" style="fill:#21796c" class="label">实现端口</text><rect x="920" y="375" width="640" height="75" rx="12" fill="white" stroke="#b8c7bf"/><text x="938" y="407" font-size="21" font-weight="bold" style="fill:#18322f" >interfaces.rest</text><text x="938" y="437" font-size="16" font-weight="normal" style="fill:#62736e" >HTTP Controller / DTO / VO</text><rect x="920" y="495" width="640" height="100" rx="12" fill="white" stroke="#b8c7bf"/><text x="938" y="527" font-size="21" font-weight="bold" style="fill:#18322f" >application</text><text x="938" y="557" font-size="16" font-weight="normal" style="fill:#62736e" >用例编排：锁、加载、调用领域、保存、审计</text><rect x="920" y="640" width="640" height="95" rx="12" fill="white" stroke="#b8c7bf"/><text x="938" y="672" font-size="21" font-weight="bold" style="fill:#18322f" >domain + domain.port</text><text x="938" y="702" font-size="16" font-weight="normal" style="fill:#62736e" >Role / User / RoleHierarchy / Policy / 仓储抽象</text><rect x="920" y="790" width="640" height="75" rx="12" fill="white" stroke="#b8c7bf"/><text x="938" y="822" font-size="21" font-weight="bold" style="fill:#18322f" >infrastructure</text><text x="938" y="852" font-size="16" font-weight="normal" style="fill:#62736e" >JPA Adapter / Entity / Redis / JWT / AOP</text><rect x="55" y="960" width="480" height="145" rx="12" fill="white" stroke="#b8c7bf"/><text x="73" y="992" font-size="21" font-weight="bold" style="fill:#18322f" >rbac-web</text><text x="73" y="1022" font-size="16" font-weight="normal" style="fill:#62736e" >独立 npm 工程；同一套前端</text><text x="73" y="1047" font-size="16" font-weight="normal" style="fill:#62736e" >通过配置接入任一中心后端</text><text x="73" y="1072" font-size="16" font-weight="normal" style="fill:#62736e" >不属于 Maven reactor</text><rect x="590" y="960" width="480" height="145" rx="12" fill="white" stroke="#b8c7bf"/><text x="608" y="992" font-size="21" font-weight="bold" style="fill:#18322f" >rbac-gateway</text><text x="608" y="1022" font-size="16" font-weight="normal" style="fill:#62736e" >第四个 Maven 模块；依赖契约</text><text x="608" y="1047" font-size="16" font-weight="normal" style="fill:#62736e" >HTTP 调用中心与课程后端</text><text x="608" y="1072" font-size="16" font-weight="normal" style="fill:#62736e" >不依赖两套中心业务实现</text><rect x="1125" y="960" width="480" height="145" rx="12" fill="white" stroke="#b8c7bf"/><text x="1143" y="992" font-size="21" font-weight="bold" style="fill:#18322f" >course-integration</text><text x="1143" y="1022" font-size="16" font-weight="normal" style="fill:#62736e" >上游锁定 + 补丁 + 覆盖层 + 前端</text><text x="1143" y="1047" font-size="16" font-weight="normal" style="fill:#62736e" >tools/prepare-course.sh 准备源码</text><text x="1143" y="1072" font-size="16" font-weight="normal" style="fill:#62736e" >教师工程独立构建</text><rect x="55" y="1150" width="1550" height="115" rx="12" fill="#e9f3ee" stroke="#b8c7bf"/><text x="73" y="1182" font-size="21" font-weight="bold" style="fill:#18322f" >支撑层 / tools · deploy · .github · docs</text><text x="73" y="1212" font-size="16" font-weight="normal" style="fill:#62736e" >契约生成与校验、共享 HTTP 验收、制图、镜像与 Swarm、CI、需求追踪和历史证据</text><text x="73" y="1237" font-size="16" font-weight="normal" style="fill:#62736e" >部署统一服务名 rbac-backend；两版同时验证时使用隔离数据库和缓存空间。</text><text x="55" y="1320" font-size="17" font-weight="normal" style="fill:#62736e" >同一外部行为 ≠ 同一内部实现；domain 的纯 JDK 约束由实际架构测试检查。</text></svg>