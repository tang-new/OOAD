<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050" role="img" aria-label="02 / 课程中心协作范围用例图"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#21796c" stroke-width="1.5"/></marker><marker id="filled" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#21796c"/></marker></defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#18322f} .mono{font-family:Consolas,'Courier New',monospace} .edge{fill:none;stroke:#21796c;stroke-width:1.5} .label{paint-order:stroke;stroke:#faf9f4;stroke-width:7;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="#faf9f4"/><rect x="0" width="9" height="100%" fill="#21796c"/><text x="44" y="49" font-size="28" font-weight="bold" style="fill:#18322f" >02 / 课程中心协作范围用例图</text><text x="45" y="80" font-size="15" font-weight="normal" style="fill:#62736e" >课程业务属于外部系统；本图说明接入背景，不将教师课程业务计入权限中心实现</text><rect x="280" y="130" width="940" height="730" rx="10" fill="#e9f3ee" stroke="#21796c"/><text x="305" y="165" font-size="22" font-weight="bold" style="fill:#18322f" >教师课程项目管理系统</text><polyline points="135,385 235,400 338,400" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="135,385 235,335 970,335 970,360" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="135,385 235,550 338,550" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="135,385 235,485 970,485 970,510" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="135,675 255,250 338,250" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="135,675 255,185 970,185 970,210" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="135,675 255,400 338,400" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="135,675 255,335 970,335 970,360" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="135,675 255,550 338,550" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="135,675 255,485 970,485 970,510" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="1355,295 1250,315 530,315 530,290" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="1355,295 1250,250 1162,250" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="1355,295 1250,730 1162,730" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="1355,735 1265,795 530,795 530,770" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="1355,735 1265,730 1162,730" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><ellipse cx="530" cy="250" rx="192" ry="40" fill="white" stroke="#21796c" stroke-width="1.5"/><text x="530" y="256" font-size="17" font-weight="normal" style="fill:#18322f" text-anchor="middle">创建 / 审核 / 维护课程</text><ellipse cx="970" cy="250" rx="192" ry="40" fill="white" stroke="#21796c" stroke-width="1.5"/><text x="970" y="256" font-size="17" font-weight="normal" style="fill:#18322f" text-anchor="middle">教学班、教师与学生名单</text><ellipse cx="530" cy="400" rx="192" ry="40" fill="white" stroke="#21796c" stroke-width="1.5"/><text x="530" y="406" font-size="17" font-weight="normal" style="fill:#18322f" text-anchor="middle">创建、加入、管理小组</text><ellipse cx="970" cy="400" rx="192" ry="40" fill="white" stroke="#21796c" stroke-width="1.5"/><text x="970" y="406" font-size="17" font-weight="normal" style="fill:#18322f" text-anchor="middle">里程碑与材料提交</text><ellipse cx="530" cy="550" rx="192" ry="40" fill="white" stroke="#21796c" stroke-width="1.5"/><text x="530" y="556" font-size="17" font-weight="normal" style="fill:#18322f" text-anchor="middle">口试时段、预约与检查</text><ellipse cx="970" cy="550" rx="192" ry="40" fill="white" stroke="#21796c" stroke-width="1.5"/><text x="970" y="556" font-size="17" font-weight="normal" style="fill:#18322f" text-anchor="middle">评分、成绩查询与导出</text><ellipse cx="530" cy="730" rx="192" ry="40" fill="white" stroke="#21796c" stroke-width="1.5"/><text x="530" y="736" font-size="17" font-weight="normal" style="fill:#18322f" text-anchor="middle">使用统一身份与全局鉴权</text><ellipse cx="970" cy="730" rx="192" ry="40" fill="white" stroke="#21796c" stroke-width="1.5"/><text x="970" y="736" font-size="17" font-weight="normal" style="fill:#18322f" text-anchor="middle">记录和查询关键操作审计</text><circle cx="110" cy="350" r="15" fill="white" stroke="#18322f" stroke-width="2"/><path d="M110 365v43m-30-28h60m-30 28l-25 33m25-33l25 33" stroke="#18322f" stroke-width="2" fill="none"/><text x="110" y="466" font-size="17" font-weight="bold" style="fill:#18322f" text-anchor="middle">学生 / 学生组长</text><circle cx="110" cy="640" r="15" fill="white" stroke="#18322f" stroke-width="2"/><path d="M110 655v43m-30-28h60m-30 28l-25 33m25-33l25 33" stroke="#18322f" stroke-width="2" fill="none"/><text x="110" y="756" font-size="17" font-weight="bold" style="fill:#18322f" text-anchor="middle">教师 / 课程组长</text><circle cx="1380" cy="260" r="15" fill="white" stroke="#18322f" stroke-width="2"/><path d="M1380 275v43m-30-28h60m-30 28l-25 33m25-33l25 33" stroke="#18322f" stroke-width="2" fill="none"/><text x="1380" y="376" font-size="17" font-weight="bold" style="fill:#18322f" text-anchor="middle">课程管理员</text><circle cx="1380" cy="700" r="15" fill="white" stroke="#18322f" stroke-width="2"/><path d="M1380 715v43m-30-28h60m-30 28l-25 33m25-33l25 33" stroke="#18322f" stroke-width="2" fill="none"/><text x="1380" y="816" font-size="17" font-weight="bold" style="fill:#18322f" text-anchor="middle">统一身份与权限中心</text><text x="45" y="920" font-size="16" font-weight="normal" style="fill:#62736e" >图为高层用例分组，不表示每种参与者都能执行椭圆内全部子操作；具体操作受角色和对象关系约束。</text><text x="45" y="947" font-size="16" font-weight="normal" style="fill:#62736e" >例如：学生查询本人成绩，教师评分与导出；管理员审核课程，教师提交课程申请。</text><text x="45" y="974" font-size="16" font-weight="normal" style="fill:#62736e" >全局 API 许可由权限中心判断；“是否本班教师 / 本组成员”继续由课程 Service 判断。</text></svg>