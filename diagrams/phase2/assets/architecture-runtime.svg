<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1270" viewBox="0 0 1660 1270" role="img" aria-label="04 / 运行时架构总览"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#21796c" stroke-width="1.5"/></marker><marker id="filled" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#21796c"/></marker></defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#18322f} .mono{font-family:Consolas,'Courier New',monospace} .edge{fill:none;stroke:#21796c;stroke-width:1.5} .label{paint-order:stroke;stroke:#faf9f4;stroke-width:7;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="#faf9f4"/><rect x="0" width="9" height="100%" fill="#21796c"/><text x="44" y="49" font-size="28" font-weight="bold" style="fill:#18322f" >04 / 运行时架构总览</text><text x="45" y="80" font-size="15" font-weight="normal" style="fill:#62736e" >两个业务系统 · 七个部署服务 · 权限后端结构化 / DDD 二选一 · 箭头表示请求或依赖方向</text><rect x="35" y="265" width="1590" height="885" rx="15" fill="#e9f3ee" stroke="#b8c7bf" stroke-dasharray="8 5"/><text x="53" y="295" font-size="15" font-weight="bold" style="fill:#21796c" >Docker 私有 overlay 网络；仅两个前端边缘发布 TLS 端口</text><polyline points="235,210 235,335" class="edge"  marker-end="url(#filled)"/><text x="250" y="260" font-size="15" font-weight="normal" style="fill:#21796c" class="label">HTTPS :8443</text><polyline points="770,210 770,335" class="edge"  marker-end="url(#filled)"/><text x="785" y="260" font-size="15" font-weight="normal" style="fill:#21796c" class="label">HTTPS :9443</text><polyline points="235,485 235,680" class="edge"  marker-end="url(#filled)"/><text x="250" y="590" font-size="15" font-weight="normal" style="fill:#21796c" class="label">/api/v1/* · /auth/*</text><polyline points="975,405 1150,405" class="edge"  marker-end="url(#filled)"/><text x="1000" y="390" font-size="15" font-weight="normal" style="fill:#21796c" class="label">/api/*</text><polyline points="1355,485 1355,680" class="edge"  marker-end="url(#filled)"/><text x="1370" y="590" font-size="15" font-weight="normal" style="fill:#21796c" class="label">去除 /api 前缀后转发</text><polyline points="630,485 630,570 360,570 360,680" class="edge"  marker-end="url(#filled)"/><text x="440" y="552" font-size="15" font-weight="normal" style="fill:#21796c" class="label">/auth/* · JWKS</text><polyline points="1210,485 1210,625 455,625 455,730" class="edge" stroke-dasharray="7 5" marker-end="url(#filled)"/><text x="700" y="610" font-size="15" font-weight="normal" style="fill:#21796c" class="label">每次请求向中心查询 API 准入</text><polyline points="1150,805 455,805" class="edge" stroke-dasharray="7 5" marker-end="url(#filled)"/><text x="605" y="788" font-size="15" font-weight="normal" style="fill:#21796c" class="label">课程后端再次检查准入、加载真实能力、同步审计</text><polyline points="235,860 235,1000 510,1000" class="edge"  marker-end="url(#filled)"/><text x="300" y="983" font-size="15" font-weight="normal" style="fill:#21796c" class="label">中心库</text><polyline points="1355,860 1355,1128 895,1128 895,1040 860,1040" class="edge"  marker-end="url(#filled)"/><text x="1080" y="1113" font-size="15" font-weight="normal" style="fill:#21796c" class="label">课程库</text><polyline points="400,860 400,925 1030,925 1030,965" class="edge" stroke-dasharray="7 5" marker-end="url(#filled)"/><text x="605" y="909" font-size="15" font-weight="normal" style="fill:#21796c" class="label">版本化 L1 / Redis L2</text><rect x="60" y="115" width="350" height="95" rx="12" fill="white" stroke="#b8c7bf"/><text x="78" y="147" font-size="21" font-weight="bold" style="fill:#18322f" >权限管理用户</text><text x="78" y="177" font-size="16" font-weight="normal" style="fill:#62736e" >管理员 / 审计查看者 / 普通用户</text><rect x="595" y="115" width="350" height="95" rx="12" fill="white" stroke="#b8c7bf"/><text x="613" y="147" font-size="21" font-weight="bold" style="fill:#18322f" >课程用户</text><text x="613" y="177" font-size="16" font-weight="normal" style="fill:#62736e" >学生 / 教师 / 课程管理员</text><rect x="60" y="335" width="395" height="150" rx="12" fill="white" stroke="#b8c7bf"/><text x="78" y="360" font-size="12" font-weight="bold" style="fill:#21796c" >01 · 权限中心前端</text><text x="78" y="388" font-size="21" font-weight="bold" style="fill:#18322f" >rbac-web</text><text x="78" y="418" font-size="16" font-weight="normal" style="fill:#62736e" >Vue 3 / TypeScript + Nginx</text><text x="78" y="443" font-size="16" font-weight="normal" style="fill:#62736e" >静态页面、TLS、中心接口代理</text><rect x="580" y="335" width="395" height="150" rx="12" fill="white" stroke="#b8c7bf"/><text x="598" y="360" font-size="12" font-weight="bold" style="fill:#21796c" >02 · 课程前端</text><text x="598" y="388" font-size="21" font-weight="bold" style="fill:#18322f" >course-web</text><text x="598" y="418" font-size="16" font-weight="normal" style="fill:#62736e" >课程集成前端 + Nginx</text><text x="598" y="443" font-size="16" font-weight="normal" style="fill:#62736e" >登录走中心，业务走网关</text><rect x="1150" y="335" width="395" height="150" rx="12" fill="white" stroke="#b8c7bf"/><text x="1168" y="360" font-size="12" font-weight="bold" style="fill:#21796c" >03 · 独立 Java 网关</text><text x="1168" y="388" font-size="21" font-weight="bold" style="fill:#18322f" >rbac-gateway</text><text x="1168" y="418" font-size="16" font-weight="normal" style="fill:#62736e" >可信 method/path → operationId</text><text x="1168" y="443" font-size="16" font-weight="normal" style="fill:#62736e" >验证令牌 → 中心决定 → 固定上游</text><rect x="60" y="680" width="395" height="180" rx="12" fill="white" stroke="#b8c7bf"/><text x="78" y="705" font-size="12" font-weight="bold" style="fill:#21796c" >04 · 当前选中的权限实现</text><text x="78" y="733" font-size="21" font-weight="bold" style="fill:#18322f" >rbac-backend</text><text x="78" y="763" font-size="16" font-weight="normal" style="fill:#62736e" >MODULE=rbac-structured 或 rbac-ddd</text><text x="78" y="788" font-size="16" font-weight="normal" style="fill:#62736e" >身份 / RBAC1 / 资源 / 集中审计</text><text x="78" y="813" font-size="16" font-weight="normal" style="fill:#62736e" >单aud JWT；私有接口需服务密钥</text><rect x="1150" y="680" width="395" height="180" rx="12" fill="white" stroke="#b8c7bf"/><text x="1168" y="705" font-size="12" font-weight="bold" style="fill:#21796c" >05 · 教师真实后端</text><text x="1168" y="733" font-size="21" font-weight="bold" style="fill:#18322f" >course-backend</text><text x="1168" y="763" font-size="16" font-weight="normal" style="fill:#62736e" >固定教师源码 + patches / overlay</text><text x="1168" y="788" font-size="16" font-weight="normal" style="fill:#62736e" >课程 / 分组 / 里程碑 / 评分</text><text x="1168" y="813" font-size="16" font-weight="normal" style="fill:#62736e" >原有对象级权限继续执行</text><rect x="510" y="965" width="350" height="135" rx="12" fill="white" stroke="#b8c7bf"/><text x="528" y="990" font-size="12" font-weight="bold" style="fill:#21796c" >06 · 两库 / 两账号</text><text x="528" y="1018" font-size="21" font-weight="bold" style="fill:#18322f" >MySQL 8</text><text x="528" y="1048" font-size="16" font-weight="normal" style="fill:#62736e" >rbac_center：15 张中心表</text><text x="528" y="1073" font-size="16" font-weight="normal" style="fill:#62736e" >rbac_course：课程业务库</text><rect x="930" y="965" width="350" height="135" rx="12" fill="white" stroke="#b8c7bf"/><text x="948" y="990" font-size="12" font-weight="bold" style="fill:#21796c" >07 · 缓存基础设施</text><text x="948" y="1018" font-size="21" font-weight="bold" style="fill:#18322f" >Redis 7</text><text x="948" y="1048" font-size="16" font-weight="normal" style="fill:#62736e" >权限缓存；数据库版本为权威</text><text x="948" y="1073" font-size="16" font-weight="normal" style="fill:#62736e" >L1 位于各后端进程内</text><text x="45" y="1170" font-size="16" font-weight="normal" style="fill:#62736e" >实线：浏览器 / 代理 / 业务 / 数据访问；虚线：中心安全查询与缓存依赖。响应沿请求链返回。</text><text x="45" y="1197" font-size="16" font-weight="normal" style="fill:#62736e" >中心管理请求不经过课程网关；公开边缘拒绝 /integration/*、/identity/*，但可信课程后端可在内网调用。</text><text x="45" y="1224" font-size="16" font-weight="normal" style="fill:#62736e" >课程事务与中心审计不共享数据库事务；同步 HTTP 不等于分布式原子提交。</text></svg>