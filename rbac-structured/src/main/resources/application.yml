server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: rbac-structured
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/rbac1_structured?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      timeout: 500ms
      connect-timeout: 500ms
management:
  endpoints:
    web:
      base-path: /api/v1/actuator
      exposure:
        include: health,info
rbac:
  bootstrap-password: ${RBAC_BOOTSTRAP_PASSWORD:}
  audit-service-key: ${RBAC_AUDIT_SERVICE_KEY:}
  cache:
    namespace: structured
  jwt:
    private-key-file: ${RBAC_JWT_PRIVATE_KEY_FILE:}
    public-key-file: ${RBAC_JWT_PUBLIC_KEY_FILE:}
    kid: ${RBAC_JWT_KID:rbac-key-1}
    issuer: ${RBAC_JWT_ISSUER:rbac-center}
    previous-public-keys: ${RBAC_JWT_PREVIOUS_PUBLIC_KEYS:}
    allow-ephemeral: false
