spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://127.0.0.1:13306/rbac1_structured_test?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${TEST_DB_USER:root}
    password: ${TEST_DB_PASSWORD:root}
  flyway:
    clean-disabled: false
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      # 专用测试实例在本机多JVM/编译并行时允许调度延迟；生产配置仍为500ms。
      timeout: 5s
rbac:
  cache:
    namespace: structured-test
  bootstrap-password: StructuredTestOnly123!
  audit-service-key: StructuredAuditTestOnly123!
  jwt:
    allow-ephemeral: true
logging:
  level:
    com.xmu.rbac.structured.config.LayerLoggingAspect: WARN
