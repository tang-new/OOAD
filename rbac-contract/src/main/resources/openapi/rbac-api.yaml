openapi: 3.0.3
info:
  title: RBAC1 统一授权中心
  version: 2.0.0
  description: 冻结实施合同；单aud JWT；UI/API分离；成功code=OK，错误裸字符串code。仅新空开发库。
servers:
- url: http://localhost:8081
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - 统一身份鉴权
      summary: 登录
      description: "由学校统一身份认证提供，本系统不代理、不持久化密码。\n`systems` 必须列出本次登录目标系统，系统标识与 JWT `aud`\
        \ 一致；登录本系统时必须包含 `course-project-management`。\n\n## accessToken 格式\n\n返回的 `accessToken`\
        \ 是 JWT 紧凑格式：\n\n```text\n<base64url(header)>.<base64url(payload)>.<signature>\n\
        ```\n\npayload 示例（具体字段以统一身份认证实际签发为准）：\n\n```json\n{\n  \"sub\": \"sso-u1001\"\
        ,\n  \"aud\": [\"course-project-management\"],\n  \"iss\": \"https://identity.example.edu\"\
        ,\n  \"iat\": 1799992800,\n  \"exp\": 1799999999,\n  \"jti\": \"01J00000000000000000000000\"\
        \n}\n```\n\n字段用途：\n\n- `sub`：统一身份用户标识；本系统用它关联教师或学生业务身份。\n- `aud`：令牌目标系统；统一身份认证据此确定权限查询的目标系统，调用本系统时必须包含\
        \ `course-project-management`。\n- `iss`、`iat`、`exp`、`jti`：签发方、签发时间、过期时间和令牌唯一标识，由\
        \ Spring Security 按统一身份认证的 JWK 校验。\n- JWT 不包含 `identity`、`roles` 或 `permissions`。登录身份由本系统按\
        \ `sub` 查询；角色和前端权限由统一身份认证权限接口返回。\n\n调用本系统接口时使用 `Authorization: Bearer <accessToken>`，前端不得解析或信任\
        \ JWT 中的权限信息。\n"
      operationId: login
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginVO'
              example:
                accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6InNzby0yMDI2In0.payload.signature
                tokenType: Bearer
                expiresIn: 7200
        '401':
          description: 账号或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: UNAUTHORIZED
                message: 账号或密码错误。
        '503':
          description: 统一身份认证服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: IDENTITY_SERVICE_UNAVAILABLE
                message: 统一身份认证暂时不可用，请稍后重试。
      x-required-permission: PUBLIC
  /auth/logout:
    post:
      tags:
      - 统一身份鉴权
      summary: 退出登录
      description: 由学校统一身份认证提供；调用后使当前访问令牌失效，本系统不保存令牌状态。
      operationId: logout
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      security:
      - bearerAuth: []
      responses:
        '204':
          description: 已退出
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-permission: '@authenticated'
  /auth/me:
    get:
      tags:
      - 统一身份鉴权
      summary: 当前用户、角色与权限
      description: '由学校统一身份认证提供。从 JWT 的 `aud` 解析目标系统，返回当前用户、角色和前端菜单/按钮权限。

        JWT 本身不包含权限，角色和权限由统一身份认证返回。

        `permissions` 仅用于前端控制菜单和按钮，后端仍必须在 Service 中做强权限校验。

        '
      operationId: getIdentityCurrentUser
      security:
      - bearerAuth: []
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      responses:
        '200':
          description: 当前用户、角色与前端权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityCurrentUserVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: 统一身份认证服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: IDENTITY_SERVICE_UNAVAILABLE
                message: 统一身份认证暂时不可用，请稍后重试。
      x-required-permission: '@authenticated'
  /auth/audit-logs:
    get:
      tags:
      - 统一身份审计
      summary: 查询统一身份审计日志
      description: '由学校统一身份认证系统提供，只支持按时间、操作对象和操作人查询。

        课程、教学班、操作类型和教师可见范围过滤由课程项目管理系统在 Service 层完成；本系统不建立审计日志表，也不保存日志副本。'
      operationId: queryIdentityAuditLogs
      x-apifox-folder: 统一身份审计
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      security:
      - bearerAuth: []
      parameters:
      - name: actor
        in: query
        schema:
          type: string
        description: 操作人姓名或工号模糊查询
      - name: actorId
        in: query
        schema:
          type: integer
        description: 操作人稳定 id 精确查询；允许筛选已删除用户的历史操作
      - name: target
        in: query
        schema:
          type: string
        description: 操作对象模糊查询
      - name: from
        in: query
        schema:
          type: string
          format: date-time
        description: 起始时间（含）
      - name: to
        in: query
        schema:
          type: string
          format: date-time
        description: 结束时间（含）
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: X-Audit-Service-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: 可信课程后端服务密钥；不得提供给浏览器。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageIdentityAuditLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 无权查询统一身份审计日志或跨越给定可见范围
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 没有查询这些课程日志的权限。
        '503':
          description: 统一身份认证服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: IDENTITY_SERVICE_UNAVAILABLE
                message: 统一身份认证暂时不可用，请稍后重试。
      x-required-permission: audit:read
    post:
      tags:
      - 统一身份审计
      summary: 写入统一身份审计日志
      description: '由学校统一身份认证系统提供。课程项目管理系统在关键业务事务成功后调用本接口写入审计日志。

        `requestId` 是业务操作生成的幂等键，同一 `requestId` 重试时统一身份系统返回同一条日志，不产生重复记录。

        本系统不建立审计日志表，也不保存日志副本。

        objectType须与objectId前缀一致。同requestId同sourceSystem/subject/规范化内容返回相同id；异体400
        AUDIT_DUPLICATE_CONFLICT。'
      operationId: writeIdentityAuditLog
      x-apifox-folder: 统一身份审计
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityAuditWriteInput'
      responses:
        '201':
          description: 审计日志已写入；同一幂等键重试时返回原日志
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAuditLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 当前系统或用户无权写入审计日志
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 没有写入审计日志的权限。
        '503':
          description: 统一身份认证服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: IDENTITY_SERVICE_UNAVAILABLE
                message: 统一身份认证暂时不可用，请稍后重试。
      x-required-permission: audit:write
      parameters:
      - name: X-Audit-Service-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: 可信课程后端服务密钥；不得提供给浏览器。
  /auth/permissions/{permission}:
    parameters:
    - name: permission
      in: path
      required: true
      description: 统一身份认证定义的前端菜单/按钮权限码
      schema:
        $ref: '#/components/schemas/UiPermission'
    get:
      tags:
      - 统一身份鉴权
      summary: 校验当前用户是否具备指定前端权限
      description: 由学校统一身份认证提供；从 JWT 的 `aud` 解析目标系统，校验路径中的前端菜单/按钮权限码。响应只返回 `allowed`，不返回权限码或权限集合。该权限码由统一身份认证定义，不使用
        AuthorityCodes。
      operationId: checkIdentityPermission
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 单个权限校验结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionCheckVO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-required-permission: '@authenticated'
  /auth/api-permissions/{operationId}:
    parameters:
    - name: operationId
      in: path
      required: true
      description: OpenAPI 中目标接口的 operationId
      schema:
        type: string
        minLength: 1
        maxLength: 128
    get:
      tags:
      - 统一身份鉴权
      summary: 判断当前用户能否调用指定 API 接口
      description: '由学校统一身份认证提供。根据 JWT 的 `aud` 确定目标系统，按 `operationId` 判断当前用户是否具备调用目标
        API

        所需的全局 `AuthorityCodes` 权限。响应只返回判断结果，不返回权限码。JWT 不包含权限。

        本接口只处理全局 API 权限；课程组长、任课教师、组员、本人等对象级权限仍由目标接口的 Service 判断。

        '
      operationId: getApiAuthority
      x-apifox-folder: 统一身份鉴权
      security:
      - bearerAuth: []
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      responses:
        '200':
          description: 当前用户调用目标 API 的权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAuthorityCheckVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: operationId 不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: API_OPERATION_NOT_FOUND
                message: 没有找到对应的 API 操作。
        '503':
          description: 统一身份认证服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: IDENTITY_SERVICE_UNAVAILABLE
                message: 统一身份认证暂时不可用，请稍后重试。
      x-required-permission: '@authenticated'
  /api/v1/me:
    get:
      operationId: getMe
      summary: 本人UserVO及当前系统EffectiveVO组成 `{user,effective}`
      x-required-permission: '@authenticated'
      x-required-audience: '@current'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - OK
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/MeVO'
                  timestamp: &id001
                    type: string
                    format: date-time
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters: []
  /api/v1/auth/password:
    post:
      operationId: changePassword
      summary: oldPassword,newPassword；204或包装null，更新tokenVersion
      x-required-permission: '@authenticated'
      x-required-audience: '@current'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - OK
                  message:
                    type: string
                  data:
                    type: object
                    nullable: true
                    enum:
                    - null
                  timestamp: *id001
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordInput'
      parameters: []
  /api/v1/systems:
    get:
      operationId: listSystems
      summary: SystemVO[]（有限注册系统）
      x-required-permission: rbac:system:view
      x-required-audience: rbac-center
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - OK
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SystemVO'
                  timestamp: *id001
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters: []
    post:
      operationId: createSystem
      summary: '{code,name}'
      x-required-permission: rbac:system:edit
      x-required-audience: rbac-center
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - OK
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/SystemVO'
                  timestamp: *id001
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemCreateInput'
      parameters: []
  /api/v1/systems/{id}:
    patch:
      operationId: updateSystem
      summary: '{name}'
      x-required-permission: rbac:system:edit
      x-required-audience: rbac-center
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - OK
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/SystemVO'
                  timestamp: *id001
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameInput'
      parameters:
      - name: id
        in: path
        required: true
        schema: &id002
          type: integer
          format: int64
          minimum: 1
  /api/v1/systems/{id}/status:
    put:
      operationId: setSystemStatus
      summary: '{status}'
      x-required-permission: rbac:system:edit
      x-required-audience: rbac-center
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - OK
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/SystemVO'
                  timestamp: *id001
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusInput'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
  /api/v1/departments/tree:
    get:
      operationId: getDepartmentTree
      summary: DepartmentVO[]
      x-required-permission: rbac:department:view
      x-required-audience: rbac-center
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - OK
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DepartmentVO'
                  timestamp: *id001
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters: []
  /api/v1/departments:
    post:
      operationId: createDepartment
      summary: '{parentId?,code,name}'
      x-required-permission: rbac:department:edit
      x-required-audience: rbac-center
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - OK
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/DepartmentVO'
                  timestamp: *id001
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreateInput'
      parameters: []
  /api/v1/departments/{id}:
    patch:
      operationId: updateDepartment
      summary: '{name}'
      x-required-permission: rbac:department:edit
      x-required-audience: rbac-center
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - OK
                  message:
