openapi: 3.1.0
info:
  title: 课程项目管理系统 API
  version: 0.1.0
  description: |
    高校「学生在课程里分组完成项目」全流程接口：组队 → 里程碑提交与检查 → 教师评分。
    角色：学生 / 组长（学生子角色）/ 任课教师 / 教学组长（课程组长）/ 管理员。同一自然人可同时拥有教师和管理员角色，登录后使用合并的教师界面。
    所有 `/auth/*` 接口和 `GET /auth/users/{userId}` 查询接口均由学校统一身份认证系统提供，课程管理系统不实现、不代理这些接口；本系统只提供 `GET /me` 等课程业务接口。

    ## 通用约定
    - 所有时间用 ISO 8601（`2026-11-18T14:00:00+08:00`）；原型里的「今天」是 2026-11-16。
    - **返回列表的接口默认分页**：查询参数 `page`（从 1 开始）+ `pageSize`（默认 20，最大 100），响应统一带 `page` / `pageSize` / `total`（见 `Page` 模型）。
      例外（**数据量固定且很少，一次返回全部，不分页**）：`GET /terms`（学期）、`GET /me/courses`（我的课程）、教学班列表、课程里的分组、本班分组、课程里程碑、口试时段、小组检查状态。
      例外：详情类接口（如某个组在某个里程碑上的提交记录）里的内嵌数组属于这条记录的完整内容，不分页；成绩表 `GET /classes/{classId}/grades` 分页返回学生行。
    - 错误统一返回 `Error`：`code` 是机器可读的业务码（字符串，见 `components.schemas.Error` 的码表与各接口 4xx 说明），`message` 是可以直接给学生/老师看的中文提示；HTTP 状态码与 `code` 是两套，前端按 `code` 决定文案与动作。
    - 「已完成的里程碑」（`done: true`）只能改权重、成绩构成与计分制；其余字段与删除都会被拒。
    - 重量不变量：同一课程的里程碑权重之和必须等于 100；允许保存中间态（合计不等于 100 时返回 `weightSum` 并在列表上标红），但发起检查前必须是 100。
    - 当前学期：新建时 `current` 恒为 false；修改不能改 `current`；**当前学期不能编辑或删除，需先取消当前学期**；用 `PUT /current-term` 替换当前学期、`DELETE /current-term` 取消。**同一时刻最多一个当前学期，允许没有当前学期**。
    - 主键约定：**所有实体 id（含学期）都是整数**，由数据库序列/自增生成。
    - 权限：接口按角色校验；越权返回 403 `FORBIDDEN`。管理员端业务写操作都有细粒度权限；`GET /terms` 与 `GET /courses/{courseId}` 为公用接口，不要管理员权限。学期权限为 `term.create/edit/delete/current.manage`，课程 `course.view/review/reset/edit/delete/team.manage`，教师 `teacher.view/create/edit/delete`，日志 `audit.view`，用户查询 `user.lookup`。共享接口只对管理员调用时追加管理员权限校验。新建与拷贝课程均由教师发起，提交者成为首位课程组长；管理员不代建、不代拷贝。教学组长进课程内任何教学班；任课教师只能进自己被指派的教学班；学生只能看开放课程、自己的课程与自己的小组。
servers:
  - url: https://api.example.edu/v1
    description: 生产
security:
  - bearerAuth: []
tags:
  - name: 统一身份鉴权
    description: 统一身份认证系统提供的外部 API，包括 `/auth/*` 和 `GET /auth/users/{userId}`。课程管理系统无需实现或代理；JWT 只用于身份认证，不包含权限。
  - name: 当前用户
    description: 本系统根据 JWT 的 sub 返回本地教师/学生业务身份、业务子角色、已校验权限与当前学期上下文。
  - name: 教师
    description: 管理员：教师列表、添加 / 修改、禁用 / 恢复、删除
  - name: 学期
    description: 管理员：创建 / 修改 / 删除学期，指定当前学期
  - name: 课程
    description: 教师新建 / 拷贝课程；管理员独立审核；学期课程与「我的课程」列表
  - name: 教学班
    description: 教学组长建班、指派任课教师
  - name: 学生名单
    description: 任课教师导入选课名单 Excel、手工增删学生
  - name: 分组规则
    description: 课程级默认值 + 教学班级覆盖
  - name: 小组
    description: 学生建组 / 加入 / 退出；教师编辑 / 解散 / 新建
  - name: 里程碑
    description: 教学组长定义课程级里程碑（所有教学班共用）
  - name: 提交与检查
    description: 学生提交材料；教师批改（通过 / 驳回 + 评语 + 小组分）
  - name: 口试与预约
    description: 本班任课教师发布时段；本班学生预约 / 改约 / 取消；教师记录口试结果
  - name: 成绩
    description: 教师成绩汇总与导出；学生的「我的成绩」
  - name: 文件与审计
    description: 附件下载、关键操作审计
  - name: 统一身份审计
    description: 学校统一身份认证系统提供的审计日志和操作人查询接口；本系统只读调用，不持久化日志副本。
paths:
  /auth/login:
    post:
      tags:
        - 统一身份鉴权
      servers:
        - url: https://identity.example.edu
          description: 学校统一身份认证（外部服务）
      summary: 登录
      description: |
        由学校统一身份认证提供，本系统不代理、不持久化密码。
        `systems` 必须列出本次登录目标系统，系统标识与 JWT `aud` 一致；登录本系统时必须包含 `course-project-management`。

        ## accessToken 格式

        返回的 `accessToken` 是 JWT 紧凑格式：

        ```text
        <base64url(header)>.<base64url(payload)>.<signature>
        ```

        payload 示例（具体字段以统一身份认证实际签发为准）：

        ```json
        {
          "sub": "sso-u1001",
          "aud": ["course-project-management"],
          "iss": "https://identity.example.edu",
          "iat": 1799992800,
          "exp": 1799999999,
          "jti": "01J00000000000000000000000"
        }
        ```

        字段用途：

        - `sub`：统一身份用户标识；本系统用它关联教师或学生业务身份。
        - `aud`：令牌目标系统；统一身份认证据此确定权限查询的目标系统，调用本系统时必须包含 `course-project-management`。
        - `iss`、`iat`、`exp`、`jti`：签发方、签发时间、过期时间和令牌唯一标识，由 Spring Security 按统一身份认证的 JWK 校验。
        - JWT 不包含 `identity`、`roles` 或 `permissions`。登录身份由本系统按 `sub` 查询；角色和前端权限由统一身份认证权限接口返回。

        调用本系统接口时使用 `Authorization: Bearer <accessToken>`，前端不得解析或信任 JWT 中的权限信息。
      operationId: login
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginVO'
              example:
                accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6InNzby0yMDI2In0.payload.signature
                tokenType: Bearer
                expiresIn: 7200
        '401':
          description: 账号或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: UNAUTHORIZED
                message: 账号或密码错误。
        '503':
          description: 统一身份认证服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: IDENTITY_SERVICE_UNAVAILABLE
                message: 统一身份认证暂时不可用，请稍后重试。
  /login:
    post:
      tags:
        - 统一身份鉴权
      summary: 课程系统登录
      description: 课程系统先按学号或工号校验本地学生、教师是否存在，再调用统一身份认证核对密码、获取访问令牌和权限。密码不落库、不记录日志。
      operationId: courseLogin
      x-apifox-folder: 统一身份鉴权
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseLoginInput'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseLoginVO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 密码错误或统一身份角色与登录入口不匹配
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: UNAUTHORIZED
                message: 账号或密码错误。
        '404':
          description: 本地学生或教师不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: LOGIN_ACCOUNT_NOT_FOUND
                message: 该学号不在本系统学生名单中。
        '503':
          description: 统一身份认证服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: IDENTITY_SERVICE_UNAVAILABLE
                message: 统一身份认证暂时不可用，请稍后重试。
  /auth/logout:
    post:
      tags:
        - 统一身份鉴权
      servers:
        - url: https://identity.example.edu
          description: 学校统一身份认证（外部服务）
      summary: 退出登录
      description: 由学校统一身份认证提供；调用后使当前访问令牌失效，本系统不保存令牌状态。
      operationId: logout
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      security:
        - bearerAuth: []
      responses:
        '204':
          description: 已退出
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags:
        - 统一身份鉴权
      servers:
        - url: https://identity.example.edu
          description: 学校统一身份认证（外部服务）
      summary: 当前用户、角色与权限
      description: |
        由学校统一身份认证提供。从 JWT 的 `aud` 解析目标系统，返回当前用户、角色和前端菜单/按钮权限。
        JWT 本身不包含权限，角色和权限由统一身份认证返回。
        `permissions` 仅用于前端控制菜单和按钮，后端仍必须在 Service 中做强权限校验。
      operationId: getIdentityCurrentUser
      security:
        - bearerAuth: []
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      responses:
        '200':
          description: 当前用户、角色与前端权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityCurrentUserVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: 统一身份认证服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: IDENTITY_SERVICE_UNAVAILABLE
                message: 统一身份认证暂时不可用，请稍后重试。
  /auth/departments:
    get:
      tags:
        - 统一身份鉴权
      servers:
        - url: https://identity.example.edu
          description: 学校统一身份认证（外部服务）
      summary: 查询统一身份部门列表（逐层展开）
      description: 由学校统一身份认证提供。按层级查询组织架构：不传 parentId 返回根部门，传入 parentId 只返回该部门的直接子部门。界面可结合 hasChildren 逐层展开。
      operationId: listIdentityDepartments
      x-apifox-folder: 统一身份鉴权
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
          description: 按部门名称或部门编码模糊查询
        - name: parentId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: 上级部门标识；不传时查询根部门，传入时查询该部门的直接子部门
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 部门分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/IdentityDepartment'
              example:
                page: 1
                pageSize: 20
                total: 1
                items:
                  - id: 1
                    code: CS
                    name: 计算机学院
                    parentId: null
                    hasChildren: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 当前用户无权读取统一身份组织架构
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 你没有查询统一身份部门的权限。
        '503':
          description: 统一身份认证服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: IDENTITY_SERVICE_UNAVAILABLE
                message: 统一身份认证暂时不可用，请稍后重试。
  /auth/departments/{departmentId}/users:
    parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: 统一身份认证系统中的部门标识
    get:
      tags:
        - 统一身份鉴权
      servers:
        - url: https://identity.example.edu
          description: 学校统一身份认证（外部服务）
      summary: 查询部门下的用户
      description: 由学校统一身份认证提供。按工号、学号或姓名分页查询指定部门下的统一身份用户，不返回电话、邮箱等联系方式。
      operationId: listIdentityDepartmentUsers
      x-apifox-folder: 统一身份鉴权
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
          description: 按姓名、工号或学号模糊查询
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 部门用户分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/IdentityDepartmentUser'
              example:
                page: 1
                pageSize: 20
                total: 1
                items:
                  - userId: sso-t1008
                    'no': T1008
                    name: 孙晨
                    departmentId: 1
                    departmentName: 计算机学院
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 当前用户无权读取该部门用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 你没有查询该部门用户的权限。
        '404':
          description: 部门不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: IDENTITY_DEPARTMENT_NOT_FOUND
                message: 统一身份认证系统中没有找到该部门。
        '503':
          description: 统一身份认证服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: IDENTITY_SERVICE_UNAVAILABLE
                message: 统一身份认证暂时不可用，请稍后重试。
  /auth/audit-logs:
    get:
      tags:
        - 统一身份审计
      servers:
        - url: https://identity.example.edu
          description: 学校统一身份认证（外部服务）
      summary: 查询统一身份审计日志
      description: |-
        由学校统一身份认证系统提供，只支持按时间、操作对象和操作人查询。
        课程、教学班、操作类型和教师可见范围过滤由课程项目管理系统在 Service 层完成；本系统不建立审计日志表，也不保存日志副本。
      operationId: queryIdentityAuditLogs
      x-apifox-folder: 统一身份审计
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      security:
        - bearerAuth: []
      parameters:
        - name: actor
          in: query
          schema:
            type: string
          description: 操作人姓名或工号模糊查询
        - name: actorId
          in: query
          schema:
            type: integer
          description: 操作人稳定 id 精确查询；允许筛选已删除用户的历史操作
        - name: target
          in: query
          schema:
            type: string
          description: 操作对象模糊查询
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: 起始时间（含）
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: 结束时间（含）
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 统一身份审计日志分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/IdentityAuditLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 无权查询统一身份审计日志或跨越给定可见范围
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 没有查询这些课程日志的权限。
        '503':
          description: 统一身份认证服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: IDENTITY_SERVICE_UNAVAILABLE
                message: 统一身份认证暂时不可用，请稍后重试。
    post:
      tags:
        - 统一身份审计
      servers:
        - url: https://identity.example.edu
          description: 学校统一身份认证（外部服务）
      summary: 写入统一身份审计日志
      description: |-
        由学校统一身份认证系统提供。课程项目管理系统在关键业务事务成功后调用本接口写入审计日志。
        `requestId` 是业务操作生成的幂等键，同一 `requestId` 重试时统一身份系统返回同一条日志，不产生重复记录。
        本系统不建立审计日志表，也不保存日志副本。
      operationId: writeIdentityAuditLog
      x-apifox-folder: 统一身份审计
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityAuditWriteInput'
      responses:
        '201':
          description: 审计日志已写入；同一幂等键重试时返回原日志
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAuditLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 当前系统或用户无权写入审计日志
