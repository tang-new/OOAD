          type: boolean
          description: 是否通知被检查的小组或学生
          default: true
    OralSlot:
      type: object
      description: 口试时段。容量按检查对象计数：分组制是组，个人制是学生。
      properties:
        id:
          type: integer
          example: 1
        milestoneId:
          type: integer
          example: 5001
        startAt:
          type: string
          format: date-time
          example: '2026-11-18T14:00:00+08:00'
