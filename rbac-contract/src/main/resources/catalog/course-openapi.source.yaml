          description: 分组制检查对象 id；个人制为 null
          example: 701
        groupNo:
          type: string
          nullable: true
          example: 1-01
        groupName:
          type: string
          nullable: true
          example: 星火队
        studentId:
          type: integer
          nullable: true
          description: 个人制检查对象 id；分组制为 null
          example: 20220101
        studentNo:
          type: string
          nullable: true
          example: '20220101'
        studentName:
          type: string
          nullable: true
          example: 张小雨
        milestoneId:
          type: integer
          example: 5001
        submittedAt:
          type: string
          format: date-time
          nullable: true
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileRef'
        note:
          type: string
          description: 文字说明
        state:
          type: integer
          enum:
            - 1
