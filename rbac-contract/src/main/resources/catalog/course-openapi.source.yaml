              subjectNo:
                type: string
                nullable: true
                description: 分组制为组号，个人制为学号
                example: 1-01
              subjectName:
                type: string
                description: 分组制为组名，个人制为学生姓名
                example: 星火队
        completed:
          type: boolean
          description: 该时段的所有已预约检查对象都已完成口试检查；空闲时段为 false
        free:
          type: boolean
          description: 还有空位
        mine:
          type: boolean
          description: 学生视角：是自己所在组或本人预约的时段
    OralSlotInput:
      type: object
