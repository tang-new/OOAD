        schema:
          type: integer
    patch:
      tags:
        - 里程碑
      summary: 修改里程碑
      description: |
        仅本课程的教学组长可修改里程碑。未完成：字段随便改。
        **已完成（`done = true`）：只有权重、成绩构成、计分制能改**，其他字段与删除都会被拒。
      operationId: updateMilestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneInput'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
