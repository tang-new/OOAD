        '403':
          description: 当前教师不是本课程的教学组长
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 只有本课程的教学组长可以新建、修改或删除里程碑。
      x-required-course-role: course_leader
  /milestones/{milestoneId}:
