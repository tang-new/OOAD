        bookLimit:
          type: integer
          description: 口试型：每个检查对象最多预约次数，≥ 2。分组制按组计数，个人制按学生计数。
          example: 3
        cancelBefore:
          type: integer
          description: 口试型：口试前多少小时内不能取消预约（0 = 不限制）
          example: 24
        done:
          type: boolean
          description: 已经完成检查：不能删除，只能改权重 / 成绩构成 / 计分制
        weightSum:
          type: integer
          description: 同一课程所有里程碑权重之和（应为 100）
          example: 100
    MilestoneInput:
      type: object
      required:
        - name
        - description
        - due
        - mode
        - weight
      properties:
        name:
          type: string
        description:
          type: string
        due:
          type: string
          format: date-time
        mode:
          type: string
          enum:
            - grading
            - oral
        weight:
          type: integer
        scale:
          type: integer
          enum:
            - 100
            - 5
          default: 100
        groupRatio:
          type: integer
          description: 仅分组制使用。分组制批改型固定 100；分组制口试型为 0~100；个人制忽略并固定为 0。
          default: 100
        bookLimit:
          type: integer
          default: 3
          minimum: 2
        cancelBefore:
          type: integer
          default: 24
          minimum: 0
    FileRef:
