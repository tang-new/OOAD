        verdict:
          type: string
          enum:
            - passed
            - rejected
        score:
          type: number
          nullable: true
          description: 检查对象分数：分组制批改/口试的 groupScore，或个人制的个人分；驳回时为空
          example: 82
        comment:
          type: string
          description: 评语（学生可见）
        reviewerName:
          type: string
          example: 李建国
        reviewedAt:
          type: string
          format: date-time
    ReviewInput:
      type: object
