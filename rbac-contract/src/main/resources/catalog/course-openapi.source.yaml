            application/json:
              schema:
                type: object
                properties:
                  weightSum:
                    type: integer
                    example: 100
                  weightValid:
                    type: boolean
                    description: 合计是否等于 100
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Milestone'
        '403':
          description: 当前用户不是本课程的师生
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 只有本课程的教学组长、任课教师和该课程学生可以查看。
      x-allowed-course-roles:
        - course_leader
        - teacher
        - student
    post:
      tags:
        - 里程碑
      summary: 新增里程碑
      description: |
        仅本课程的教学组长可新建里程碑。教学组长**在课程层**定义。分组制按小组检查，个人制按学生个人检查。允许先建好再调平权重：保存时合计不等于 100% 不会被拒，但会在 `weightSum` 里返回并在列表上标红，
        发起检查前必须调平。
      operationId: createMilestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneInput'
      responses:
        '201':
          description: 已新增
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Milestone'
                  - type: object
                    properties:
                      warning:
                        type: string
                        nullable: true
                        example: 当前权重合计 110%，超出 10%：请调低其他里程碑的权重，使合计等于 100%。
        '400':
          description: 单个权重非法（≤ 0 或 > 100）或口试设置不合法
