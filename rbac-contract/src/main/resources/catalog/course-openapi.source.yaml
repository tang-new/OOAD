          example: 20220107
    Milestone:
      type: object
      properties:
        id:
          type: integer
          example: 1
        courseId:
          type: integer
          example: 101
        name:
          type: string
          example: 中期答辩
        description:
          type: string
          description: 里程碑描述
          example: 现场演示 8 分钟，并说明成员分工和关键取舍
        due:
          type: string
          format: date-time
        mode:
          type: string
          enum:
            - grading
            - oral
          description: grading = 批改型；oral = 口试型
        weight:
          type: integer
          description: 百分比权重
          example: 25
        scale:
          type: integer
          description: 计分制：100 = 百分制，5 = 5 分制
          enum:
            - 100
            - 5
          default: 100
        groupRatio:
          type: integer
          description: 小组成绩占比（%）；个人占比 = 100 - groupRatio。分组制批改型固定 100；个人制固定 0（个人占比 100%）
