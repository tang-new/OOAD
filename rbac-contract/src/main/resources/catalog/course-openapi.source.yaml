          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 只有本教学班的任课教师可以新建小组。
  /groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - 小组
      summary: 小组详情（仅本课程师生）
      description: 仅分组制课程的本课程教学组长、任课教师和选课学生可查看；外课程用户和其他用户返回 403。个人制课程不会产生小组，读取小组资源返回 404。
      operationId: getGroup
      x-allowed-course-roles:
        - course_leader
        - teacher
        - student
      responses:
        '200':
          description: 小组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '403':
          description: 当前用户不是本课程师生
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 只有本课程的教学组长、任课教师和选课学生可以查看小组详情。
    patch:
      tags:
        - 小组
      summary: 教师编辑小组（改名 / 直接增删成员）
      description: 仅分组制课程可用；**当前教师必须是该小组所属教学班的任课教师**。教师直接加入或移除成员，无需组长同意，也不受人数上下限约束。当前组长不能被直接移除；如需更换组长，必须先由组长转交。跨教学班、跨课程或课程组长但非本班任课教师返回 403。
      operationId: updateGroup
      x-required-group-class-role: class_teacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInput'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '403':
          description: 当前教师不是该小组所属教学班的任课教师
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 只有该小组所属教学班的任课教师可以编辑小组。
    delete:
      tags:
        - 小组
      summary: 解散小组（物理删除，当前组长或本班任课教师）
      description: 仅分组制课程可用。学生侧只有当前组长可在组队截止前解散，普通组员无权解散；教师侧必须是该小组所属教学班的任课教师，跨班、跨课程或仅担任课程组长但非本班任课教师不得解散。二次确认后物理删除 ProjectGroup 及成员、入组申请和归属快照，组内成员回到未组队状态；历史提交与成绩保留组号、组名快照。
      operationId: dissolveGroup
      x-allowed-dissolve-actors:
        - group_leader
        - class_teacher
      x-required-teacher-group-class-role: class_teacher
      responses:
        '204':
          description: 已解散
        '403':
          description: 当前用户不是本组组长，也不是小组所属教学班的任课教师
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 只有当前组长或该小组所属教学班的任课教师可以解散小组。
        '409':
          description: 学生侧已过组队截止时间
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: GROUPING_DEADLINE_PASSED
                message: 组队已经截止，学生不能解散小组。
  /groups/{groupId}/join-requests:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - 小组
      summary: 加入申请列表（组长）
      description: 仅当前组长可查看；默认返回待审批申请。申请在组队截止时自动过期。申请状态变化后保留记录，包括 approved。
      operationId: listGroupJoinRequests
      parameters:
        - name: state
          in: query
          schema:
            type: integer
            enum:
              - 1
              - 2
              - 3
              - 4
              - 5
            default: 1
            description: 1 = pending；2 = approved；3 = rejected；4 = cancelled；5 = expired。
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 申请列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/GroupJoinRequest'
        '403':
          description: 当前学生不是这个小组的组长
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 只有当前组长可以审批加入申请。
    post:
      tags:
        - 小组
      summary: 提交加入申请（学生）
      description: |
        组队截止前，学生填写小组编号后提交申请。申请不会直接入组，必须由当前组长同意。
        当前学生必须属于该小组所属课程；外课程学生不得提交。同一课程中最多一个待审批申请；学生可主动撤回。
      operationId: createGroupJoinRequest
      x-required-role: student
      x-required-group-course-role: student
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupJoinRequestInput'
      responses:
        '202':
          description: 已提交，等待组长审批
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupJoinRequest'
        '403':
          description: 当前用户不是该小组所属课程的学生
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 只有该小组所属课程的学生可以提交加入申请。
        '409':
          description: 已经入组 / 已有待审批申请 / 已过截止 / 人数或跨班规则不允许
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                pendingRequest:
                  value:
                    code: JOIN_REQUEST_PENDING
                    message: 你已经有一个待审批的加入申请。
                deadline:
                  value:
                    code: GROUPING_DEADLINE_PASSED
                    message: 组队已经截止，不能再提交加入申请。
                full:
                  value:
                    code: GROUP_SIZE_OUT_OF_RANGE
                    message: 这个小组已经满 5 人了。
                crossClass:
                  value:
                    code: CROSS_CLASS_NOT_ALLOWED
                    message: 本课程不允许跨班分组。
  /join-requests/{requestId}:
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags:
        - 小组
      summary: 审批加入申请（组长）
      description: 当前组长同意或拒绝。同意时保留申请记录并置为 approved，同时创建 GroupMembership；拒绝时保留记录并置为 rejected。同意时必须再次校验组队截止、人数、跨班规则和申请人状态。**达到组内人数上限后，系统自动否决该组所有剩余待审批申请。**
      operationId: decideGroupJoinRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupJoinRequestDecisionInput'
      responses:
        '200':
          description: 已处理并保留申请记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupJoinRequest'
        '403':
          description: 当前学生不是该组组长
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 只有当前组长可以审批加入申请。
        '409':
          description: 申请已失效 / 已过组队截止 / 同意后人数超限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: JOIN_REQUEST_NOT_PENDING
                message: 这个申请已经处理或过期了。
    delete:
      tags:
        - 小组
      summary: 撤回加入申请（学生）
      description: 只有申请人本人可以撤回尚未处理的申请；撤回后可以重新申请。
      operationId: cancelGroupJoinRequest
      responses:
        '204':
          description: 已撤回
        '403':
          description: 当前学生不是申请人
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 只能撤回自己的加入申请。
        '409':
          description: 申请已经处理或过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: JOIN_REQUEST_NOT_PENDING
                message: 这个申请已经处理或过期了。
  /groups/{groupId}/members/{studentId}:
    parameters:
      - name: groupId
