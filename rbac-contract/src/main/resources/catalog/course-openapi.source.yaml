          nullable: true
          description: 最近一次进入管理员审核队列的时间。
    AdminCourse:
      description: 管理员课程视图：包含课程本身、统计信息与任课教师，不返回 nextMilestone、myGroup 等学生专属字段。
      allOf:
        - $ref: '#/components/schemas/CourseBase'
        - type: object
          required:
            - teachers
          properties:
            teachers:
              type: array
              description: 本课程所有教学班的任课教师（去重），用于管理员课程列表和审核时展示；不包含联系方式。
              items:
                $ref: '#/components/schemas/CourseTeacher'
    StudentCourse:
      description: 学生的「我的课程」视图：包含当前学期的组队状态、下一里程碑与我的小组。
      allOf:
        - $ref: '#/components/schemas/CourseBase'
        - type: object
          required:
            - teachers
            - groupState
            - nextMilestone
            - myGroup
          properties:
            teachers:
              type: array
              description: 本课程所有教学班的任课教师（去重）；不包含电话、邮箱等联系方式。
              items:
                $ref: '#/components/schemas/CourseTeacher'
            groupState:
              type: string
              enum:
                - joined
                - not_joined
                - not_applicable
              description: 分组制为 joined/not_joined；个人制固定为 not_applicable。
            nextMilestone:
              oneOf:
                - $ref: '#/components/schemas/NextMilestoneSummary'
                - type: 'null'
              description: 学生视角：下一个里程碑；没有时为 null。
            myGroup:
              oneOf:
                - $ref: '#/components/schemas/MyGroupSummary'
                - type: 'null'
              description: 学生视角：当前小组；未组队或课程为个人制时为 null。
    TeacherCourse:
      description: 教师的「我的课程」视图：只包含教师在课程中的身份，不返回学生组队与里程碑状态。
      allOf:
        - $ref: '#/components/schemas/CourseBase'
        - type: object
          required:
            - myRoleInCourse
          properties:
            myRoleInCourse:
              type: string
              description: 当前教师在课程里的身份。
              enum:
                - course_leader
                - teacher
    TeachingClassUpdateInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 200
          description: 新的教学班名称；班序号由系统维护，不可修改。
          example: 软工 2203 班
    IdentityDepartment:
      type: object
      required:
        - id
        - code
        - name
        - hasChildren
      properties:
        id:
          type: integer
          minimum: 1
          description: 统一身份认证系统中的部门标识
          example: 1
        code:
          type: string
          maxLength: 64
          description: 部门编码
          example: CS
        name:
          type: string
          maxLength: 200
          description: 部门名称
          example: 计算机学院
        parentId:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: 上级部门标识；根部门为 null
        hasChildren:
          type: boolean
          description: 是否存在直接子部门，用于决定界面是否显示展开箭头
          example: true
    IdentityDepartmentUser:
      type: object
      required:
        - userId
        - 'no'
        - name
        - departmentId
        - departmentName
      properties:
        userId:
          type: string
          description: 学校统一身份认证系统中的用户标识
          example: sso-t1008
        'no':
          type: string
          description: 工号或学号
          example: T1008
        name:
          type: string
          description: 姓名
          example: 孙晨
        departmentId:
          type: integer
          minimum: 1
          description: 所属部门标识
          example: 1
        departmentName:
          type: string
          description: 所属部门名称
          example: 计算机学院
    IdentityUser:
      type: object
      required:
        - userId
        - 'no'
        - name
      properties:
        userId:
          type: string
          description: 学校统一身份认证系统中的用户标识
          example: sso-t1008
        'no':
          type: string
          description: 工号
          example: T1008
        name:
          type: string
          description: 姓名
          example: 孙晨
    CourseLoginInput:
      type: object
      required:
        - role
        - account
        - password
      properties:
        role:
          type: string
          enum:
            - student
            - teacher
          description: 登录入口角色
          example: student
        account:
          type: string
          maxLength: 128
          description: 学生学号或教师工号
          example: '20260001'
        password:
          type: string
          format: password
          maxLength: 256
          writeOnly: true
          description: 统一身份认证密码；本系统只转发校验，不落库、不记录日志
    CourseLoginVO:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: 统一身份认证签发的 JWT 访问令牌
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: 令牌有效期，单位秒
          example: 7200
        user:
          $ref: '#/components/schemas/CurrentUserVO'
