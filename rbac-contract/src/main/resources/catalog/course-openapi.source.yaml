      summary: 记录小组口试检查结果
      description: |
        路径明确指定小组和里程碑。只有本班任课教师可以记录；结论为通过 / 驳回，可填写口试备忘录和小组分，并逐位录入组内学生个人分。
        每个检查对象每个口试里程碑只记录一次；完成后只能修改检查结果。
      operationId: createGroupOralRecord
      x-required-class-role: class_teacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OralRecordInput'
      responses:
        '201':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OralStatus'
        '403':
          description: 当前教师不是本班任课教师
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 只有本教学班的任课教师可以记录口试结果。
        '409':
          description: 口试检查已经完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ORAL_ALREADY_FINISHED
                message: 这个小组的口试检查已经完成；如需修改，请使用口试记录修改接口。
  /milestones/{milestoneId}/students/{studentId}/oral-records:
    parameters:
      - $ref: '#/components/parameters/MilestoneId'
      - name: studentId
        in: path
        required: true
        schema:
          type: integer
    post:
      tags:
        - 口试与预约
      summary: 记录个人口试检查结果
      description: 路径明确指定学生和里程碑。只有本班任课教师可以记录个人口试的结论、备忘录和个人分。
      operationId: createStudentOralRecord
      x-required-class-role: class_teacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OralRecordInput'
      responses:
        '201':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OralStatus'
        '403':
          description: 当前教师不是本班任课教师
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 只有本教学班的任课教师可以记录口试结果。
  /oral-records/{oralRecordId}:
    parameters:
      - name: oralRecordId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags:
        - 口试与预约
      summary: 修改已完成的口试检查结果
      description: 「检查状态」里点「修改」用它，可以改分数与记录；分组制可修改组内每位学生的个人分。当前教师必须是该口试记录所属教学班的任课教师，跨班、跨课程或课程组长但非本班任课教师返回 403。
      operationId: updateOralRecord
      x-required-oral-record-class-role: class_teacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OralRecordInput'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OralStatus'
        '403':
          description: 当前教师不是该口试记录所属教学班的任课教师
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 只有该口试记录所属教学班的任课教师可以修改检查结果。
  /oral-records/{oralRecordId}/memo-summary:
    parameters:
      - name: oralRecordId
        in: path
        required: true
        schema:
          type: integer
    post:
      tags:
        - 口试与预约
      summary: 录音转文字摘要（口试备忘录）
      description: 上传口试录音，服务端做语音转文字 + 摘要，返回的文本教师可以再改。当前教师必须是该口试记录所属教学班的任课教师；跨班、跨课程或课程组长但非本班任课教师返回 403。
      operationId: summarizeOralMemo
      x-required-oral-record-class-role: class_teacher
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - audio
              properties:
                audio:
                  type: string
                  format: binary
      responses:
        '200':
          description: 摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoSummaryResult'
        '403':
          description: 当前教师不是该口试记录所属教学班的任课教师
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 只有该口试记录所属教学班的任课教师可以生成口试备忘录。
  /classes/{classId}/grades:
    parameters:
      - $ref: '#/components/parameters/ClassId'
    get:
      tags:
        - 成绩
      summary: 成绩汇总（教师：学生 × 里程碑）
      description: |
        一行一个学生，每个里程碑一格：格子主值是**该里程碑的原始得分**。分组制附带小组分与个人分；个人制只附带个人分。
        最右边一列是最终成绩 = Σ(得分 ÷ 满分 × 100 × 权重)，还有里程碑没评完的标 `pending = true`。
        **当前教师必须是该教学班的任课教师**；跨班、跨课程或课程组长但非本班任课教师返回 403。
      operationId: getClassGrades
      x-required-class-role: class_teacher
      responses:
        '200':
          description: 成绩表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gradebook'
        '403':
          description: 当前教师不是该教学班的任课教师
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 只有该教学班的任课教师可以查看成绩。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
  /classes/{classId}/grades/export:
    parameters:
      - $ref: '#/components/parameters/ClassId'
    post:
      tags:
        - 成绩
      summary: 导出成绩表（Excel）
      description: 分组制至少包含学号、姓名、小组、各里程碑的小组分与个人分、小组得分、个人得分、最终成绩；个人制至少包含学号、姓名、各里程碑个人分、个人得分、最终成绩。当前教师必须是该教学班的任课教师；跨班、跨课程或课程组长但非本班任课教师返回 403。
      operationId: exportClassGrades
      x-required-class-role: class_teacher
      responses:
        '200':
          description: Excel 文件
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '403':
          description: 当前教师不是该教学班的任课教师
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 只有该教学班的任课教师可以导出成绩。
  /me/courses/{courseId}/grades:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags:
        - 成绩
      summary: 学生的「我的成绩」（一行一个里程碑）
      description: |
        学生视角不是学生×里程碑的大表，而是**一行一个里程碑**：得分（原始分，重点）、个人分；分组制额外返回小组分。
        最后一列是**该里程碑的最终成绩**（= 得分 ÷ 满分 × 100 × 权重）；这一列相加就是顶部的「当前总成绩」。
      operationId: getMyGrades
      responses:
        '200':
          description: 我的成绩
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentGrades'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
  /files/{fileId}:
    parameters:
      - name: fileId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - 文件与审计
      summary: 下载提交材料
      description: 只有本课程的教师、以及提交它的组内学生能下载。
      operationId: downloadFile
      responses:
        '200':
          description: 文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
  /audit-logs:
    get:
      tags:
        - 文件与审计
      summary: 日志查询
      description: 日志由统一身份系统持久化；本接口只做权限校验、可见范围过滤与只读代理查询，本系统不建立审计日志表。教师与管理员可查，学生不可见。教师调用时，服务端只返回本人担任课程组长的课程全部日志，以及本人任教教学班的日志；同课程其他教学班、未任教且未担任组长的课程日志不得返回。管理员可查看全部日志。即使传入 `courseId` / `classId`，也必须在该可见范围内再次过滤。
      operationId: listAuditLogs
      x-admin-required-permission: AV
      parameters:
        - name: termId
          in: query
          schema:
            type: integer
          description: 按学期筛选
        - $ref: '#/components/parameters/CourseIdQuery'
        - name: classId
          in: query
          schema:
            type: integer
          description: 按教学班筛选；教师只能查询自己任教的教学班
        - name: type
          in: query
          schema:
            type: string
            enum:
              - score_changed
              - group_changed
              - milestone_changed
              - roster_changed
        - name: actor
          in: query
          schema:
            type: string
          description: 按操作人姓名或工号模糊查询
        - name: actorId
          in: query
          schema:
            type: integer
          description: 选中用户后按稳定用户 id 精确筛选；允许筛选已删除用户的历史操作
        - name: target
          in: query
          schema:
            type: string
          description: 按操作对象模糊查询，例如小组名、学生、名单或里程碑
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: 起始时间（含）
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: 结束时间（含）
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 日志
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditLog'
        '403':
          description: 当前用户无权查看审计日志
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 你没有查看这些课程日志的权限。
  /teachers:
    get:
      tags:
        - 教师
      summary: 教师列表（管理员）
      description: 管理员查询教师列表需 teacher.view 权限；带「任课总数」「本学期任教」与「是否可删除」；`deletable = false` 的教师不显示删除入口。
      operationId: listTeachers
      x-admin-required-permission: TV
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: 按姓名 / 工号 / 院系搜索
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 教师列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Teacher'
        '403':
          description: 当前管理员没有查看教师列表的权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 你没有查看教师列表的权限。
    post:
      tags:
        - 教师
      summary: 添加教师
      description: 按 userId 调用学校统一身份认证系统获取姓名与工号后创建教师；不接收手工姓名和工号。
      operationId: createTeacher
      x-required-role: admin
      x-required-permission: TEC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherCreateInput'
      responses:
        '201':
          description: 已添加
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
        '403':
          description: 当前管理员没有添加教师的权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 你没有添加教师的权限。
  /teachers/{teacherId}:
    parameters:
      - name: teacherId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags:
        - 教师
      summary: 修改教师信息
      description: 改姓名时，课程里的引用（课程组长 / 任课教师）会一起改。
      operationId: updateTeacher
      x-required-role: admin
      x-required-permission: TEE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherUpdateInput'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
        '403':
          description: 当前管理员没有修改教师信息的权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 你没有修改教师信息的权限。
    delete:
      tags:
        - 教师
      summary: 删除教师
      description: |
        前提：**任何学期**的任何课程里都不担任课程组长、也不担任任课教师。
        不满足时列表上的删除是灰的，接口返回 `TEACHER_IN_USE`。
      operationId: deleteTeacher
      x-required-role: admin
      x-required-permission: TED
      responses:
        '204':
          description: 已删除
        '403':
          description: 当前管理员没有删除学期的权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 你没有删除学期的权限。
        '404':
          description: 学期不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: TERM_NOT_FOUND
                message: 学期不存在。
        '409':
          description: 还在担任课程组长或任课教师
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: TEACHER_IN_USE
                message: 李建国 在 5 门课程中担任课程组长、在 5 门课程中担任任课教师，不能删除；请先在对应课程里换掉他。
  /current-term:
    put:
      tags:
        - 学期
      summary: 替换当前学期
      description: 需管理员权限 term.current.manage。把系统的当前学期指针替换为指定学期；原来的当前学期会自动变为非当前。重复提交同一 termId 结果一致。
      operationId: replaceCurrentTerm
      x-required-role: admin
      x-required-permission: TCM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentTermInput'
      responses:
        '204':
          description: 已替换当前学期
        '403':
          description: 当前管理员没有管理当前学期的权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 你没有管理当前学期的权限。
        '404':
          description: 学期不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: TERM_NOT_FOUND
                message: 学期不存在。
    delete:
      tags:
        - 学期
      summary: 取消当前学期
      description: 需管理员权限 term.current.manage。删除系统的当前学期指针。本操作幂等：当前没有学期时重复调用仍返回 204。
      operationId: clearCurrentTerm
      x-required-role: admin
      x-required-permission: TCM
      responses:
        '204':
          description: 已取消；本来就没有当前学期时也返回 204
        '403':
          description: 当前管理员没有管理当前学期的权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 你没有管理当前学期的权限。
  /teacher/courses:
    get:
      tags:
        - 课程
      summary: 教师的我的课程
      description: 教学组长看自己当组长的课，任课教师看自己被指派的课；可以用 termId 切换学期，不传默认当前学期。可切换的学期清单复用 GET /terms。
      operationId: listTeacherCourses
      parameters:
        - name: termId
          in: query
          required: false
          description: 要查看哪个学期；不传默认当前学期。
          schema:
            type: integer
          example: 202601
      responses:
        '200':
          description: 教师课程列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  term:
                    oneOf:
                      - type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 2026-2027 学年第一学期
                      - type: 'null'
                    description: 当前选择的学期；没有当前学期且未传 termId 时为 null。
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeacherCourse'
                  isCurrentTerm:
                    type: boolean
                    description: 当前查看的是不是当前学期
  /auth/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
        description: 学校统一身份认证系统中的用户标识
    get:
      tags:
        - 统一身份鉴权
      summary: 查询统一身份用户
      description: 添加教师时调用学校统一身份认证系统，按外部用户标识获取姓名与工号；姓名和工号不在本系统手工录入。
      operationId: lookupIdentityUser
      x-required-role: admin
      x-required-permission: TEC
      responses:
        '200':
          description: 统一身份用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityUser'
        '403':
          description: 当前管理员没有添加教师的权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: 你没有添加教师的权限。
        '404':
          description: 统一身份系统中不存在该用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: IDENTITY_USER_NOT_FOUND
                message: 统一身份认证系统中没有找到该用户。
      servers:
        - url: https://identity.example.edu
          description: 学校统一身份认证（外部服务）
      x-apifox-folder: 统一身份鉴权
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        学校统一身份认证系统签发的 JWT。业务 API 只接受该令牌，令牌校验、角色与权限查询均以统一身份认证系统为准。
        JWT 不包含权限；Service 通过统一身份认证权限接口和业务对象关系完成权限判断。
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TermId:
      name: termId
      in: path
      required: true
      schema:
        type: integer
      example: 202601
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: integer
      example: 101
    CourseIdQuery:
      name: courseId
      in: query
      schema:
        type: integer
      example: 101
    ClassId:
      name: classId
      in: path
      required: true
      schema:
        type: integer
      example: 1001
    MilestoneId:
      name: milestoneId
      in: path
      required: true
      schema:
        type: integer
      example: 5001
  responses:
    BadRequest:
      description: 参数不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BAD_REQUEST
            message: 请填写里程碑名称
    Unauthorized:
      description: 未登录或登录已失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: 请先登录
    Forbidden:
      description: 没有权限（例如任课教师动了别人教学班、学生动了教师功能）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: 你不是这个教学班的任课教师
    NotFound:
      description: 对象不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: 找不到这个对象
    CourseNotGroupBased:
      description: 课程不是分组制，没有小组或分组规则
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: COURSE_NOT_GROUP_BASED
            message: 这门课程采用个人制，不使用小组和分组规则。
    CourseNotIndividual:
      description: 课程不是个人制，提交应归属于小组
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: COURSE_NOT_INDIVIDUAL
            message: 这门课程采用分组制，请由小组提交材料。
    Conflict:
      description: 业务规则不允许（code 见各接口说明）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: MILESTONE_RECORDED
            message: 这门课已经有里程碑记录，不能再移除任课教师
  schemas:
    Error:
      type: object
      description: 统一错误结构：`code` 是业务错误码（字符串），`message` 是可以直接展示的中文提示，可选带 `details` 补充信息
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: |
            业务错误码（机器可读，字符串）。HTTP 状态码与 `code` 是两套：同一个 HTTP 409 可能对应不同 `code`，
            前端按 `code` 决定文案与后续动作。常用码：
            - `BAD_REQUEST`（参数/校验不通过）、`UNAUTHORIZED`（未登录/密码错）、`FORBIDDEN`（无权限/账号被禁用）、`NOT_FOUND`（对象不存在）
            - `TERM_NAME_EXISTS`（学期名称全局重复）
            - COURSE_NOT_FOUND（课程不存在）
            - `GROUP_RULE_NOT_FOUND`（分组制课程尚未设置课程级默认规则）
            - `TERM_HAS_COURSES`（学期里还有课程，不能删）
            - `TERM_IS_CURRENT`（当前学期不能编辑或删除）
            - `COURSE_HAS_STUDENTS`（课程里还有学生，不能删）
            - `CLASS_HAS_GROUPS`（教学班已产生小组，不能删）
            - `CLASS_NO_CONFLICT`（同一课程内教学班编号重复）
            - `MILESTONE_RECORDED`（已有里程碑记录，不能移除任课教师；课程组长仍可更换）
            - `MILESTONE_DONE_LOCKED`（已完成的里程碑被锁：只能改权重/成绩构成/计分制；提交材料也已锁定）
            - `WEIGHT_SUM_NOT_100`（权重合计不等于 100%）
            - `GROUP_SIZE_OUT_OF_RANGE`（人数不在上下限内）
            - `CROSS_CLASS_NOT_ALLOWED`（本课程不允许跨班分组）
            - `ALREADY_IN_GROUP`（同一课程同时只能属于一个组）
            - `BOOKING_LIMIT_REACHED`（预约次数用完）
            - `SLOT_FULL`（时段已满）
            - `CANCEL_WINDOW_CLOSED`（进入「口试前 X 小时不能取消预约」的时间窗）
            - `ORAL_LIMIT_REACHED`（口试次数用完）
            - `TEACHER_IN_USE`（教师还在担任课程组长或任课教师，不能删除）
          examples:
            - MILESTONE_RECORDED
            - CANCEL_WINDOW_CLOSED
        message:
          type: string
          description: 给用户看的中文说明（可直接挂在表单或 toast 上）
          example: 这门课已经有里程碑记录，不能再移除任课教师
        details:
          type: object
          additionalProperties: true
          description: '补充信息，例如 { "weightSum": 110, "need": -10 }'
    Page:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          example: 43
    Role:
      type: string
      description: 同一 User 可以同时拥有多个角色，例如 `teacher` 和 `admin`。组长是学生的子角色（`isLeader`），课程组长是教师的子角色（`isCourseLeader`）。
      enum:
        - student
        - teacher
        - admin
    UiPermission:
      type: string
      minLength: 1
      description: 统一身份认证定义的前端菜单/按钮权限码；不使用 AuthorityCodes，具体编码由统一身份认证维护
      example: course.view
    UserLookupItem:
      type: object
      required:
        - id
        - number
        - name
        - roles
        - deleted
      properties:
        id:
          type: integer
          example: 11
        number:
          type: string
          description: 学号或工号
          example: T1001
        name:
          type: string
          example: 李建国
        roles:
          type: array
          description: 同一自然人可同时拥有多个角色，例如教师和管理员
          items:
            $ref: '#/components/schemas/Role'
          example:
            - teacher
            - admin
        deleted:
          type: boolean
          description: 用户资料是否已删除；统一身份系统中的历史日志仍保留该操作人
    LoginInput:
      type: object
      required:
        - username
        - password
        - systems
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          description: 学校统一身份认证账号
          example: 20220101
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
          description: 密码只转发给统一身份认证，不落库、不记录日志
          writeOnly: true
        systems:
          type: array
          minItems: 1
          uniqueItems: true
          description: 本次登录目标系统列表；系统标识必须与 JWT `aud` 一致，登录本系统时至少包含 `course-project-management`
          items:
            type: string
            minLength: 1
          example:
            - course-project-management
    LoginVO:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: 统一身份认证签发的 JWT 访问令牌；格式为 header.payload.signature，只用于身份认证，不包含 identity、roles 或 permissions
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: 令牌有效期，单位秒
          example: 7200
    PermissionCheckVO:
      type: object
      required:
        - allowed
      properties:
        allowed:
          type: boolean
          description: 当前用户是否具备路径中指定的前端菜单/按钮权限
          example: true
    IdentityCurrentUserVO:
      type: object
      description: 统一身份认证系统返回的当前用户身份、角色与前端权限
      required:
        - subject
        - roles
        - permissions
      properties:
        subject:
          type: string
          description: 统一身份用户标识，对应 JWT `sub`
          example: sso-u1001
        roles:
          type: array
          description: 统一身份系统中的角色；同一自然人可以同时拥有教师和管理员角色
          items:
            $ref: '#/components/schemas/Role'
          example:
            - teacher
            - admin
        permissions:
          type: array
          description: 统一身份认证定义的前端菜单/按钮权限码，不使用 AuthorityCodes；后端仍由 Service 做强权限校验
          items:
            $ref: '#/components/schemas/UiPermission'
          example:
            - CV
            - CR
            - CE
        name:
          type: string
          example: 张小雨
        'no':
          type: string
          description: 学号或工号
          example: '20220101'
    ApiAuthorityCheckVO:
      type: object
      required:
        - operationId
        - allowed
      properties:
        operationId:
          type: string
          example: listAdminCourses
        allowed:
          type: boolean
          description: 当前用户是否具备调用目标 API 所需的全局 AuthorityCodes 权限；不返回权限码
          example: true
    CurrentUserVO:
      type: object
      required:
        - userId
        - number
        - name
        - roles
        - permissions
      properties:
        userId:
          type: string
          description: 统一身份用户标识，对应 JWT `sub`
          example: sso-u1001
        teacherId:
          type: integer
          description: 本系统教师 id；当前用户没有教师身份时不返回
          example: 11
        studentId:
          type: integer
          description: 本系统学生 id；当前用户没有学生身份时不返回
          example: 20220101
        number:
          type: string
          description: 工号或学号，来自统一身份认证
          example: '20220101'
        name:
          type: string
          description: 姓名，来自统一身份认证
          example: 张小雨
        roles:
          type: array
          description: 统一身份系统中的角色
          items:
            $ref: '#/components/schemas/Role'
          example:
            - teacher
            - admin
        permissions:
          type: array
          description: 统一身份认证定义的前端菜单/按钮权限码，不使用 AuthorityCodes；不来自 JWT，后端仍由 Service 做强权限校验
          items:
            $ref: '#/components/schemas/UiPermission'
          example:
            - CV
            - CR
            - CE
    Term:
      type: object
      properties:
        id:
          type: integer
          description: 学期 id（整数，由数据库序列/自增生成）
          example: 202601
        name:
          type: string
          description: 学期名称，全局唯一
          example: 2026-2027 学年第一学期
        startDate:
          type: string
          format: date
          example: '2026-09-01'
        endDate:
          type: string
          format: date
          example: '2027-01-15'
        current:
          type: boolean
          description: 只读。同一时刻最多一个当前学期；可以没有当前学期。通过 `PUT /current-term` 替换，`DELETE /current-term` 取消。
          readOnly: true
        courseCount:
          type: integer
          example: 5
        studentCount:
          type: integer
          example: 163
    TermInput:
      type: object
      required:
        - name
        - startDate
        - endDate
      properties:
        name:
          type: string
          description: 学期名称，全局唯一
          example: 2026-2027 学年第二学期
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      description: 新建 / 修改学期只能设置名称与起止日期；当前学期要调用单独的 `PUT /current-term` 替换。
    Teacher:
      type: object
      required:
        - id
        - userId
        - 'no'
        - name
        - title
        - dept
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: string
          description: 学校统一身份认证系统中的用户标识
          example: sso-t1001
        'no':
          type: string
          description: 工号，来自统一身份认证系统
          example: T1001
        name:
          type: string
          description: 姓名，来自统一身份认证系统
          example: 李建国
        title:
          type: string
          example: 教授
        dept:
          type: string
          example: 软件工程系
        totalCourseCount:
          type: integer
          description: 「任课总数」= 任何学期里担任课程组长或任课教师的课程数
          example: 5
        currentTermCourseCount:
          type: integer
          description: 「本学期任教」
          example: 3
        deletable:
          type: boolean
          description: 当前是否可删除；false 表示仍在任何课程中担任课程组长或任课教师，界面不显示删除入口。
    TeacherCreateInput:
      type: object
      required:
        - userId
        - title
        - dept
      properties:
        userId:
          type: string
          description: 学校统一身份认证系统中的用户标识；服务端据此获取姓名与工号
          example: sso-t1008
        title:
          type: string
          example: 讲师
        dept:
          type: string
          example: 软件工程系
    TeacherUpdateInput:
      type: object
      required:
        - title
        - dept
      properties:
        title:
          type: string
          example: 副教授
        dept:
          type: string
          example: 软件工程系
    CourseInput:
      type: object
      description: 管理员修改课程名称、代码与描述；不接受 workMode。
      required:
        - name
        - code
      properties:
        name:
          type: string
        code:
          type: string
        description:
          type: string
          description: 课程描述，可为空
    CourseCreateInput:
      type: object
      description: 新建课程；workMode 在创建后不可修改。
      required:
        - name
        - code
        - workMode
      properties:
        name:
          type: string
        code:
          type: string
        workMode:
          $ref: '#/components/schemas/CourseWorkMode'
        description:
          type: string
          description: 课程描述，可为空；缺省时保存为空字符串
    CourseDescriptionInput:
      type: object
      properties:
        description:
          type: string
          description: 课程描述，可为空
    CourseStatus:
      type: integer
      description: 课程状态整数编码。1 = application（申请）；2 = pending（待审核）；3 = open（开放）。
      enum:
        - 1
        - 2
        - 3
    CourseReviewInput:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - approved
            - rejected
        comment:
          type: string
          description: 审核意见；驳回时必填
    CourseWorkMode:
      type: string
      description: 课程运行方式。group = 分组制；individual = 个人制。
      enum:
        - group
        - individual
    CourseLeadersInput:
      type: object
      required:
        - teacherIds
      properties:
        teacherIds:
          type: array
          description: 课程组长（教学组长）可以多名，随时可换，不受里程碑记录限制
          items:
            type: integer
          example:
            - 11
            - 12
    CopyCourseRequest:
      type: object
      required:
        - targetTermId
        - sourceCourseId
        - code
      properties:
        targetTermId:
          type: integer
          description: 目标学期 id
          example: 202602
        sourceCourseId:
          type: integer
          description: 唯一要拷贝的源课程 id；当前教师必须是该课程的任课教师或课程组长
          example: 101
        code:
          type: string
          maxLength: 64
          description: 新课程代码；必须全局唯一
          example: SE-2027-COPY
    TeachingClass:
      type: object
      properties:
        id:
          type: integer
          example: 1
        courseId:
          type: integer
          example: 101
        'no':
          type: integer
          description: 班序号，系统自动分配（小组编号前缀）
          example: 1
        name:
          type: string
          example: 软工 2201 班
        teachers:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              name:
                type: string
                example: 李建国
        studentCount:
          type: integer
          example: 41
        groupCount:
          type: integer
          description: 归属本班的小组数
          example: 12
        rosterImported:
          type: boolean
          description: 是否通过 Excel 成功导入过本班选课名单。true 表示至少导入过一次，false 表示尚未导入；手工添加学生不一定会改变该值。
        rosterUpdatedAt:
          type: string
          format: date-time
          nullable: true
          description: 本班名单最近一次发生变更的时间，包括 Excel 导入、手工添加或删除学生；从未建立或维护名单时为 null。
        groupRuleSource:
          type: string
          enum:
            - course
            - class
          description: 本班分组规则是跟随课程默认还是已自定义
        groupedCount:
          type: integer
          description: 本班已组队的学生总数。
          example: 39
        ungroupedCount:
          type: integer
          description: 本班尚未组队的学生总数。
          example: 2
    TeachingClassInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: 软工 2203 班
      description: 批量新建中的一个教学班，只提供名称；班级编号由系统自动分配。
    TeachingClassesInput:
      type: object
      required:
        - classes
      properties:
        classes:
          type: array
          minItems: 1
          description: 一次建立的教学班，按数组顺序连续分配班序号
          items:
            $ref: '#/components/schemas/TeachingClassInput'
    ClassTeachersInput:
      type: object
      required:
        - teacherIds
      properties:
        teacherIds:
          type: array
          description: 指派/更换本班任课教师（可多位）
          items:
            type: integer
          example:
            - 11
            - 12
    Student:
      type: object
      required:
        - id
        - 'no'
        - name
      properties:
        id:
          type: integer
          example: 1
        'no':
          type: string
          description: 学号；全局唯一
          example: '20220101'
        name:
          type: string
          description: 学生姓名
          example: 张小雨
        groupNo:
          type: string
          nullable: true
          example: 1-01
        groupName:
          type: string
          nullable: true
          example: 星火队
        isLeader:
          type: boolean
        grouped:
          type: boolean
        identityLinked:
          type: boolean
          readOnly: true
          description: 是否已关联统一身份用户；由名单接口实时查询统一身份认证系统得出，不在本系统数据库存储
        warning:
          type: string
          nullable: true
          description: 手工添加时，若学号已存在但输入姓名与系统姓名不同，返回提示；系统不会修改已有姓名
    StudentInput:
      type: object
      required:
        - 'no'
        - name
      properties:
        'no':
          type: string
          description: 学号；全局唯一。优先按学号匹配已有学生记录。
        name:
          type: string
          description: 姓名；用于展示和同名区分，不单独作为全局唯一键。
    StudentCandidate:
      type: object
      properties:
        studentId:
          type: integer
          example: 1
        'no':
          type: string
          example: '20220101'
        name:
          type: string
          example: 张小雨
        className:
          type: string
          nullable: true
          description: 当前已知的教学班名称；没有时可为 null
          example: 软工 2201 班
        alreadyInClass:
          type: boolean
          description: 是否已经在本教学班名单中
        identityLinked:
          type: boolean
          readOnly: true
          description: 是否已关联统一身份用户；实时查询，不落库
    GroupRule:
      type: object
      properties:
        minSize:
          type: integer
          example: 3
        maxSize:
          type: integer
          example: 5
        allowCrossClass:
          type: boolean
          example: false
        startAt:
          type: string
          format: date-time
        deadline:
          type: string
          format: date-time
          example: '2026-09-28T23:59:00+08:00'
        deadlinePassed:
          type: boolean
          description: 截止后学生侧冻结
    GroupRuleInput:
      type: object
      required:
        - minSize
        - maxSize
        - allowCrossClass
        - startAt
        - deadline
      properties:
        minSize:
          type: integer
          minimum: 1
        maxSize:
          type: integer
          minimum: 1
        allowCrossClass:
          type: boolean
        startAt:
          type: string
          format: date-time
        deadline:
          type: string
          format: date-time
    EffectiveGroupRule:
      allOf:
        - $ref: '#/components/schemas/GroupRule'
        - type: object
          properties:
            source:
              type: string
              description: course = 跟随课程默认（课程改了会跟着变）；class = 本班已自定义
              enum:
                - course
                - class
            courseDefaults:
              $ref: '#/components/schemas/GroupRule'
    Group:
      type: object
      properties:
        id:
          type: integer
          example: 1
        courseId:
          type: integer
          example: 101
        'no':
          type: string
          description: 编号规则「班序号-小组序号」
          example: 1-03
        name:
          type: string
          description: 学生建组时自行填写
          example: 麒麟队
        leader:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: 李明
        members:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              'no':
                type: string
              name:
                type: string
              classId:
                type: integer
                example: 1001
              className:
                type: string
                example: 软工 2201 班
              isLeader:
                type: boolean
        memberCount:
          type: integer
          example: 3
        ownerClass:
          type: object
          description: 归属教学班 —— 归哪个班就由那个班的任课老师负责检查与评分
          properties:
            id:
              type: integer
              example: 1
            'no':
              type: integer
              example: 1
            name:
              type: string
              example: 软工 2201 班
        ownerReason:
          type: string
